# A French project the golden prompts render. Scenes and layers are listed in order, and cells name their
# layer by position. A stale recap read an older version of its cell.
project:
  title: Les Heures claires
  premise: Dans une ville de bord de mer, Marie attend le retour de Paul, parti sans un mot. Une lettre sans signature relance leur histoire.
  language: fr
layers:
  - kind: manuscript
    name: Manuscrit
    description: Le texte du roman.
  - kind: notes
    name: Personnages
    description: Qui apparaît dans la scène, et ce qu'on apprend de chacun.
  - kind: notes
    name: Intrigue
    description: Ce que la scène fait avancer.
scenes:
  - title: Ouverture
    description: Marie attend sous la pluie.
    cells:
      - layer: 0
        content:
          blocks:
            - kind: narration
              text: La pluie battait les vitres du café. Marie gardait les yeux sur la porte.
            - kind: dialogue
              speaker: Marie
              parts:
                - tone: à voix basse
                - text: Il ne viendra pas.
      - layer: 1
        content:
          text: Marie, institutrice, trente ans. Elle attend Paul depuis deux ans.
      - layer: 2
        content:
          text: Installe l'absence de Paul.
  - title: La lettre
    description: Une lettre sans signature arrive.
    cells:
      - layer: 0
        content:
          blocks:
            - kind: narration
              text: Le facteur déposa une enveloppe sans timbre. Marie reconnut l'écriture avant même de l'ouvrir.
            - kind: dialogue
              speaker: Marie
              parts:
                - text: Demain, à l'aube, sur le quai.
        recap:
          summary: Une lettre sans signature arrive chez Marie. Elle y reconnaît l'écriture de Paul, qui lui donne rendez-vous sur le quai à l'aube.
          names: [Marie, Paul]
      - layer: 1
        content:
          text: Le facteur, pressé.
  - title: Le quai
    description: Marie retrouve Paul à l'aube.
    prompt: Garder un ton retenu, sans effusion.
    cells:
      - layer: 0
        content:
          blocks:
            - kind: narration
              text: L'aube grisait le port.
            - kind: dialogue
              speaker: Paul
              parts:
                - text: Tu as reçu ma lettre.
            - kind: narration
              text: Marie ne répondit pas tout de suite.
            - kind: dialogue
              speaker: Marie
              parts:
                - tone: sèchement
                - text: Deux ans, Paul.
      - layer: 1
        content:
          text: Paul, revenu de Brest. Marie.
  - title: Retour
    description: Paul raconte ses deux années.
    cells:
      - layer: 0
        content:
          blocks:
            - kind: narration
              text: |-
                Ils marchèrent jusqu'au phare sans parler. Paul s'arrêta devant la grille rouillée.

                Il raconta Brest, le chantier, le capitaine Morel qui l'avait pris sous son aile, puis la dette.
            - kind: dialogue
              speaker: Paul
              parts:
                - text: Je ne pouvais pas t'écrire.
                - tone: après un silence
                - text: Pas avant d'avoir tout remboursé.
        recap:
          summary: Paul raconte qu'il a travaillé deux ans à Brest pour le capitaine Morel.
          names: [Paul, Morel]
          stale: true
      - layer: 1
        content:
          text: Paul ; le capitaine Morel, son ancien patron.
  - title: Épilogue
    description: Un an plus tard.
    cells:
      - layer: 1
        content:
          text: Marie seule sur le quai, une lettre à la main.
budgets:
  suggest: 2420
  consolidate: 1050
  check: 1350
requests:
  suggest:
    targets:
      - scene: 2
        layer: 0
        mode: revise
        range: { start: 1, end: 3 }
        kept: [2]
      - scene: 3
        field: title
        mode: write
      - scene: 4
        layer: 2
        mode: write
    instruction: Rends la scène plus tendue, sans ajouter de dialogue.
    exclude: [2]
    overrides:
      scenes:
        - scene: 0
          title: Ouverture
          description: Marie attend Paul sous la pluie, au café du port.
  consolidate:
    cell: { scene: 3, layer: 0 }
  check:
    scenes: { start: 0, end: 3 }
    instruction: Vérifie surtout la chronologie.
