steps:
  - key: manuscript
    promptTemplate: Turn the idea into a concise prose manuscript proposal.
    outputSchema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      required:
        - title
        - format
        - scenes
      properties:
        title:
          type: string
          minLength: 1
        format:
          const: prose
        scenes:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - title
              - blocks
            properties:
              title:
                type: string
                minLength: 1
              blocks:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - kind
                    - text
                  properties:
                    kind:
                      enum:
                        - prose
                        - dialogue
                        - cue
                    text:
                      type: string
                      minLength: 1
