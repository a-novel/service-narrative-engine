syntax = "proto3";

package anovel.template.v0;

import "anovel/template/v0/item.proto";

// ItemUpdateService replaces the mutable attributes of an existing item.
service ItemUpdateService {
  // Replaces the name and description of the item with the given ID, and returns it. Returns
  // INVALID_ARGUMENT for a malformed ID or invalid attributes, and NOT_FOUND when no item has the ID.
  rpc ItemUpdate(ItemUpdateRequest) returns (ItemUpdateResponse);
}

// ItemUpdateRequest identifies the item to update and carries its new attributes.
message ItemUpdateRequest {
  // ID of the item to update, formatted as a UUID.
  string id = 1;
  // New name of the item: required, not blank, 256 characters at most.
  string name = 2;
  // New description of the item, 1024 characters at most. Empty clears it.
  string description = 3;
}

// ItemUpdateResponse returns the item with its updated attributes.
message ItemUpdateResponse {
  // The updated item.
  Item item = 1;
}
