$schema: https://json-schema.org/draft/2020-12/schema
$id: https://schemas.a-novel.test/lib/content
$defs:
  alpha:
    $anchor: alpha
    type: object
    additionalProperties: false
    required:
      - value
    properties:
      value:
        type: string
  beta:
    $anchor: beta
    type: object
    additionalProperties: false
    required:
      - count
    properties:
      count:
        type: number
  number:
    type: number
  integer:
    type: integer
  cycleA:
    type: object
    properties:
      child:
        $ref: "#/$defs/cycleB"
  cycleB:
    type: object
    properties:
      child:
        $ref: "#/$defs/cycleA"
  nestedAlpha:
    $id: nested-alpha
    $ref: https://schemas.a-novel.test/lib/content#alpha
  nestedBeta:
    $id: nested-beta
    $ref: https://schemas.a-novel.test/lib/content#beta
type: object
additionalProperties: false
dependentRequired:
  trigger:
    - companion
dependencies:
  legacy:
    - legacyCompanion
  schemaTrigger:
    properties:
      secondary:
        type: string
minProperties: 2
required:
  - title
  - details
properties:
  title:
    type: string
    maxLength: 32
  details:
    type: object
    additionalProperties: false
    required:
      - summary
    properties:
      summary:
        type: string
  selection:
    oneOf:
      - type: object
        additionalProperties: false
        required:
          - alpha
        properties:
          alpha:
            type: string
      - type: object
        additionalProperties: false
        required:
          - beta
        properties:
          beta:
            type: number
  referencedSelection:
    oneOf:
      - $ref: "#/$defs/alpha"
      - $ref: "#/$defs/beta"
  anchoredSelection:
    oneOf:
      - $ref: "#alpha"
      - $ref: "#beta"
  nestedResourceSelection:
    oneOf:
      - $ref: nested-alpha
      - $ref: nested-beta
  numericSelection:
    oneOf:
      - $ref: "#/$defs/number"
      - $ref: "#/$defs/integer"
  cyclicSelection:
    oneOf:
      - $ref: "#/$defs/cycleA"
      - $ref: "#/$defs/cycleB"
  trigger:
    type: string
  companion:
    type: string
  legacy:
    type: string
  legacyCompanion:
    type: string
  schemaTrigger:
    type: string
  secondary:
    type: string
  forbidden:
    type: string
not:
  required:
    - forbidden
