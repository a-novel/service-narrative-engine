$schema: http://json-schema.org/draft-07/schema#
$id: https://schemas.a-novel.test/lib/draft7
definitions:
  alpha:
    $id: "#alpha"
    type: object
    required:
      - value
    properties:
      value:
        type: string
  beta:
    type: object
    required:
      - count
    properties:
      count:
        type: number
type: object
properties:
  selection:
    oneOf:
      - $ref: "#alpha"
      - $ref: "#/definitions/beta"
