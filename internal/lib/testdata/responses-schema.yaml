$schema: https://json-schema.org/draft/2020-12/schema
title: Provider contract
type: object
properties:
  kind:
    type: string
    const: scene
    minLength: 1
  count:
    type: integer
    minimum: 0
  nested:
    anyOf:
      - type: object
        properties:
          $schema:
            type: string
          const:
            type: string
          minLength:
            type: string
          label:
            type: string
            maxLength: 64
        required:
          - label
        additionalProperties: true
      - type: "null"
  tags:
    type: array
    minItems: 1
    items:
      type: string
required:
  - kind
additionalProperties: true
