# Each generation kind's model, and the size of its prompts as token estimates (four characters to a token).
# Limits stay under the 272K input tokens past which OpenAI bills long context at twice the rate, and long
# limits under the 1,050,000-token window of each model, less its output cap. Reasoning tokens count toward
# maxOutputTokens, and an output cut short fails.
#
# A generation runs one regular call when it fits, then one call as long context, then several calls when
# its kind splits it.
kinds:
  # suggest writes the author's text, on a model made for natural writing. A call's rewrite takes at most half
  # its output cap, the rest left for reasoning, unless it rewrites a single text or block.
  suggest:
    model: gpt-6.1-terra
    reasoning: medium
    maxOutputTokens: 64000
    budget: 32000
    limit: 128000
    longLimit: 960000
    split: true
  # consolidate recaps one cell or one beat, on the most efficient model. Its small budget lets a project that
  # opts into AI late recap every cell within the per-user token windows of service-genai, and its output cap
  # fits the condensed version of a scene at its 400,000-character cap.
  consolidate:
    model: gpt-6-luna
    reasoning: none
    maxOutputTokens: 64000
    budget: 6000
    limit: 200000
    longLimit: 960000
  # check reasons across many scenes, on a model close to the flagship at a fraction of its price.
  check:
    model: gpt-6.1-sol
    reasoning: high
    maxOutputTokens: 64000
    budget: 64000
    limit: 200000
    longLimit: 960000
    split: true
