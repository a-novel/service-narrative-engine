name: start-ci-services
description: Start and wait for the requested CI Compose topology.

inputs:
  services:
    required: true
    description: Space-separated Compose services to start.
  database_image:
    required: false
    default: service-narrative-engine-database:ci
    description: Narrative database image reference.
  standalone_rest_image:
    required: false
    default: service-narrative-engine-standalone-rest:ci
    description: Narrative standalone REST image reference.
  json_keys_database_image:
    required: false
    default: ghcr.io/a-novel/service-json-keys/database:v2.13.8@sha256:a7fd1aa7ba4476c6775e391fd632e0e292ca0667a25bec07a0cc3fab57afad3a
    description: JSON keys database image reference.
  json_keys_grpc_image:
    required: false
    default: ghcr.io/a-novel/service-json-keys/standalone-grpc:v2.13.8@sha256:cc98bac2189237b4b412bf9ce1d5c5b0d7d86f78dfa4819dce429b4e4c85dd13
    description: JSON keys gRPC image reference.
  authentication_database_image:
    required: false
    default: ghcr.io/a-novel/service-authentication/database:v2.18.3@sha256:cce2b62f9486ddbf490e142525c444777782593845b1c2a6ab4ddab06eb94846
    description: Authentication database image reference.
  authentication_rest_image:
    required: false
    default: ghcr.io/a-novel/service-authentication/standalone-rest:v2.18.3@sha256:0ced347da22073e9b06f33cf319f3b8713b2638677654858c1d5b2c70d102ff1
    description: Authentication REST image reference.
  genai_database_image:
    required: false
    default: ghcr.io/a-novel/service-genai/database:v0.7.4@sha256:880e760f2f03f4ffdaf2affc186d10a91a12f711602a4c0983a9d70d837efb70
    description: GenAI database image reference.
  genai_migrations_image:
    required: false
    default: ghcr.io/a-novel/service-genai/jobs/migrations:v0.7.4@sha256:b51b10e271d29e67aeed16ec37ae06a93920ce4b50b3491ce87ee4c16a3187da
    description: GenAI migrations image reference.
  genai_grpc_image:
    required: false
    default: ghcr.io/a-novel/service-genai/grpc:v0.7.4@sha256:1addd9ad74ce419e4624563b60d0217a20dc9f57c291f58e872be52b7132d65b
    description: GenAI gRPC image reference.
  registry_login:
    required: false
    default: "false"
    description: When "true", authenticate to ghcr.io with the current job token.

runs:
  using: composite
  steps:
    - name: Log in to the container registry
      if: inputs.registry_login == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REGISTRY_USERNAME: ${{ github.actor }}
      run: |
        set -euo pipefail
        printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${REGISTRY_USERNAME}" --password-stdin

    - name: Start CI services
      shell: bash
      env:
        CI_SERVICES: ${{ inputs.services }}
        COMPOSE_PROJECT_NAME: ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        DATABASE_IMAGE: ${{ inputs.database_image }}
        STANDALONE_REST_IMAGE: ${{ inputs.standalone_rest_image }}
        JSON_KEYS_DATABASE_IMAGE: ${{ inputs.json_keys_database_image }}
        JSON_KEYS_GRPC_IMAGE: ${{ inputs.json_keys_grpc_image }}
        AUTHENTICATION_DATABASE_IMAGE: ${{ inputs.authentication_database_image }}
        AUTHENTICATION_REST_IMAGE: ${{ inputs.authentication_rest_image }}
        GENAI_DATABASE_IMAGE: ${{ inputs.genai_database_image }}
        GENAI_MIGRATIONS_IMAGE: ${{ inputs.genai_migrations_image }}
        GENAI_GRPC_IMAGE: ${{ inputs.genai_grpc_image }}
        MAIL_UI_PORT: 8025
        POSTGRES_PASSWORD: postgres
      run: |
        set -euo pipefail
        read -r -a services <<< "${CI_SERVICES}"

        set +e
        docker compose --file builds/compose.ci.yaml up \
          --detach \
          --no-build \
          --wait \
          --wait-timeout 120 \
          "${services[@]}"
        status=$?
        set -e

        if (( status == 0 )); then
          exit 0
        fi

        docker compose --file builds/compose.ci.yaml ps --all || true
        docker compose --file builds/compose.ci.yaml logs --no-color || true
        exit "${status}"
