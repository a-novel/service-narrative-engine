name: start-ci-services
description: Start and wait for the requested CI Compose topology.

inputs:
  services:
    required: true
    description: Space-separated Compose services to start.
  database_image:
    required: false
    default: service-narrative-engine-database:ci
    description: Database image reference used by the CI topology.
  standalone_rest_image:
    required: false
    default: service-narrative-engine-standalone-rest:ci
    description: Standalone REST image reference used by the CI topology.
  json_keys_database_image:
    required: false
    default: ghcr.io/a-novel/service-json-keys/database:v2.15.5@sha256:06457d216da6416e58262893731c6caf4382d74e89baa13aa79eaffd629c771c
    description: JSON Keys database image reference used by the CI topology.
  json_keys_grpc_image:
    required: false
    default: ghcr.io/a-novel/service-json-keys/standalone-grpc:v2.15.5@sha256:3a16b2ba54bb403b38f8647160cc99d1150a13105a832bfeb18a2bdb07135fcc
    description: JSON Keys gRPC image reference used by the CI topology.
  authentication_database_image:
    required: false
    default: ghcr.io/a-novel/service-authentication/database:v2.25.0@sha256:e49463997f86041d1e146c6060cc19ab37992ea7ef929627584db6ff16832ffa
    description: Authentication database image reference used by the CI topology.
  authentication_rest_image:
    required: false
    default: ghcr.io/a-novel/service-authentication/standalone-rest:v2.25.0@sha256:3fc393184b8f3644193a21a86faed1ebfa809f8290ee9a8a5ce64ee6cd4c326a
    description: Authentication REST image reference used by the CI topology.
  genai_database_image:
    required: false
    default: ghcr.io/a-novel/service-genai/database:v0.8.7@sha256:9b6505f703c8c3bd86e5ab7110ba37c7065984b0b04875894e3c51416a095263
    description: genai database image reference used by the CI topology.
  genai_grpc_image:
    required: false
    default: ghcr.io/a-novel/service-genai/standalone-grpc:v0.8.7@sha256:a06573881ea3d4e05a12441d2bd5f28475beea6a581789d528107ed3808ce738
    description: genai gRPC image reference used by the CI topology.
  registry_login:
    required: false
    default: "false"
    description: When "true", authenticate to ghcr.io with the current job token.

runs:
  using: composite
  steps:
    - name: Log in to the container registry
      if: inputs.registry_login == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REGISTRY_USERNAME: ${{ github.actor }}
      run: |
        set -euo pipefail
        printf '%s' "${GH_TOKEN}" | docker login ghcr.io --username "${REGISTRY_USERNAME}" --password-stdin

    - name: Start CI services
      shell: bash
      env:
        CI_SERVICES: ${{ inputs.services }}
        COMPOSE_PROJECT_NAME: ci-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
        DATABASE_IMAGE: ${{ inputs.database_image }}
        JSON_KEYS_DATABASE_IMAGE: ${{ inputs.json_keys_database_image }}
        JSON_KEYS_GRPC_IMAGE: ${{ inputs.json_keys_grpc_image }}
        AUTHENTICATION_DATABASE_IMAGE: ${{ inputs.authentication_database_image }}
        AUTHENTICATION_REST_IMAGE: ${{ inputs.authentication_rest_image }}
        GENAI_DATABASE_IMAGE: ${{ inputs.genai_database_image }}
        GENAI_GRPC_IMAGE: ${{ inputs.genai_grpc_image }}
        POSTGRES_PASSWORD: postgres
        STANDALONE_REST_IMAGE: ${{ inputs.standalone_rest_image }}
      run: |
        set -euo pipefail
        read -r -a services <<< "${CI_SERVICES}"

        set +e
        docker compose --file builds/compose.ci.yaml up \
          --detach \
          --no-build \
          --wait \
          --wait-timeout 120 \
          "${services[@]}"
        status=$?
        set -e

        if (( status == 0 )); then
          exit 0
        fi

        docker compose --file builds/compose.ci.yaml ps --all || true
        docker compose --file builds/compose.ci.yaml logs --no-color || true
        exit "${status}"
