name: main

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

# A newer push to a pull request cancels its older run, freeing the shared runners. Each label
# event, which GitHub can admit out of order, and every non-PR run gets a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}${{ endsWith(github.event.action, 'labeled') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # The template deploys nothing, so it edits its migrations in place. A fork is no template
  # repository, so the guard runs there.
  check-migration-snapshots:
    if: github.event_name == 'pull_request' && !github.event.repository.is_template
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The job removes append-only-override once a push makes it stale.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check schema snapshots
        uses: a-novel-kit/workflows/generic-actions/check-append-only@v1.87.1
        with:
          path: internal/models/migrations/testdata/schema
          base: ${{ github.event.pull_request.base.sha }}
          github_token: ${{ github.token }}
      - name: Check migration SQL
        uses: a-novel-kit/workflows/generic-actions/check-append-only@v1.87.1
        with:
          path: ":(glob)internal/models/migrations/*.sql"
          base: ${{ github.event.pull_request.base.sha }}
          github_token: ${{ github.token }}

  generated-go:
    needs: [build-database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &start-local-database
        uses: $/.github/actions/start-ci-services
        with:
          services: postgres
          database_image: ghcr.io/${{ github.repository }}/database@${{ needs.build-database.outputs.digest }}
          registry_login: "true"
      - uses: a-novel-kit/workflows/go-actions/generate-go@v1.87.1

  lint-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/go-actions/lint-go@v1.87.1

  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/lint-node@v1.87.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          lint_action: "lint:ci"

  lint-shell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/lint-shell@v1.87.1
        with:
          run_steps: .github/actions/*/action.yml .github/workflows/*.yaml

  lint-dockerfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/lint-dockerfile@v1.87.1

  # The service ruleset checks the structural conventions golangci-lint cannot express.
  lint-semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/security-actions/lint-semgrep@v1.87.1
        with:
          ruleset: service

  # gitleaks scans for secrets offline, so no hosted service can block a merge.
  scan-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/security-actions/scan-secrets@v1.87.1

  # zizmor audits the workflows, excessive job permissions included.
  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.87.1

  test-go:
    needs: [build-database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *start-local-database
      - uses: $/.github/actions/run-migrations
      - uses: a-novel-kit/workflows/go-actions/test-go@v1.87.1
        with:
          include: /internal|/cmd
          skip_setup: true
          test_artifact: gotest
          coverage_artifact: gocover
          coverage_file: coverage.txt
          modfile: gotestsum.mod
          race: "true"

  test-pkg-js:
    needs: [build-database, build-standalone-rest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      REST_URL: "http://localhost:8080"
      SERVICE_AUTHENTICATION_URL: "http://localhost:4000"
      MAIL_UI_URL: "http://localhost:8025"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/start-ci-services
        with:
          services: standalone-rest service-authentication
          database_image: ghcr.io/${{ github.repository }}/database@${{ needs.build-database.outputs.digest }}
          standalone_rest_image: ghcr.io/${{ github.repository }}/standalone-rest@${{ needs.build-standalone-rest.outputs.digest }}
          registry_login: "true"
      - uses: a-novel-kit/workflows/node-actions/test-node@v1.87.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          coverage_artifact: jscover
          test_action: "test:ci"

  build-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: a-novel-kit/workflows/build-actions/docker@v1.87.1
        id: build
        with:
          file: builds/database.Dockerfile
          image_name: ${{ github.repository }}/database
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_args: -e POSTGRES_PASSWORD=postgres

  # Infra tells a real database change from a version bump by digest alone, so the image must
  # rebuild to the same digest.
  test-reproducible-database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/build-actions/check-reproducible@v1.87.1

  build-migrations:
    needs: [build-database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *start-local-database
      - uses: a-novel-kit/workflows/build-actions/docker@v1.87.1
        with:
          mode: job
          file: builds/migrations.Dockerfile
          image_name: ${{ github.repository }}/jobs/migrations
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_args: >-
            -e POSTGRES_HOST="${POSTGRES_HOST}"
            -e POSTGRES_PORT="${POSTGRES_PORT}"
            -e POSTGRES_USER="${POSTGRES_USER}"
            -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
            -e POSTGRES_DATABASE="${POSTGRES_DATABASE}"
            -e POSTGRES_TLS_ENABLED="${POSTGRES_TLS_ENABLED}"

  build-rest:
    needs: [build-database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *start-local-database
      - uses: $/.github/actions/run-migrations
      - uses: a-novel-kit/workflows/build-actions/docker@v1.87.1
        with:
          file: builds/rest.Dockerfile
          image_name: ${{ github.repository }}/rest
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # The smoke run calls the server directly; production gives it an issuer.
          run_args: >-
            -e POSTGRES_HOST="${POSTGRES_HOST}"
            -e POSTGRES_PORT="${POSTGRES_PORT}"
            -e POSTGRES_USER="${POSTGRES_USER}"
            -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}"
            -e POSTGRES_DATABASE="${POSTGRES_DATABASE}"
            -e POSTGRES_TLS_ENABLED="${POSTGRES_TLS_ENABLED}"
            -e SERVICE_ISSUER_OPTIONAL=true

  build-standalone-rest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    # test-pkg-js boots this image and runs the JS client suite against it, so the job only builds
    # and pushes it, without a smoke run.
    steps:
      - uses: a-novel-kit/workflows/build-actions/docker@v1.87.1
        id: build
        with:
          file: builds/standalone.rest.Dockerfile
          image_name: ${{ github.repository }}/standalone-rest
          github_token: ${{ secrets.GITHUB_TOKEN }}
          skip_healthcheck: true

  build-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/build-node@v1.87.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_action: "build:rest"

  report-codecov:
    runs-on: ubuntu-latest
    needs: [test-go, test-pkg-js]
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/generic-actions/codecov@v1.87.1
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  publish-docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && success()
    # lint-js checks the openapi files this job deploys.
    needs: [lint-js]
    # GitHub Pages allows one deployment in flight per site. The group serializes concurrent
    # master runs.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: a-novel-kit/workflows/github-pages-actions/publish-api-docs@v1.87.1
