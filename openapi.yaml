openapi: 3.1.0

servers:
  - url: http://127.0.0.1:{rest_port}
    variables:
      rest_port:
        default: "8080"

info:
  title: Service Narrative Engine API
  summary: The backend of the Narrative Engine.
  description: |
    The public REST API of the Narrative Engine, a workstation for writing narratives.

    ## Projects

    A project holds one narrative. Every project route acts for the signed-in user, who owns the projects it
    reads and writes. A project of another user answers as if it did not exist.

    Each write replaces what it targets, and the last write wins. Every record keeps the time it was
    last written.

    ## Instances and links

    A project is a set of instances and one list of links. An instance is one use of a plugin in the project:
    it pins the exact version of the plugin, and holds the document the plugin edits, its content. A link
    relates two items of the project, each addressed by the instance that holds it. The first instance of a
    project becomes its default, the one the project opens on.

    The service stores these documents and bounds their size and their shape. It never reads what they mean:
    it validates no content against the schema of its plugin, and never checks that a plugin version, an
    instance or an item a document names exists. The client validates, migrates and repairs them.

    A write of a content or of the links replaces the whole document, and names the `updatedAt` the client
    read. It applies only while the document still carries that value, and answers 409 once another write
    changed it: nothing is merged, and the client reads the document again. An `updatedAt` keeps microseconds,
    which a JavaScript date drops, so a client keeps the text it received and sends it back as it is.

    ## Plugin registry

    The registry holds the published versions of each plugin. A version is a manifest (the JSON Schema of the
    content it edits and the items it exports), a UI module, an optional migration module and its
    translations. A version never changes once published, so a project that pins one loads the same modules for
    good. Semantic versioning orders the versions, and a prerelease is read by its exact name only: no list
    returns one. Any signed-in user reads the registry, which belongs to no user.

  version: v1.9.1
  license:
    name: RPL-1.5
    url: "https://raw.githubusercontent.com/a-novel/service-narrative-engine/refs/heads/master/LICENSE"

security:
  - BearerAuth: []

tags:
  - name: health
    description: Liveness and dependency checks.
  - name: project
    description: Projects, their logos, and what a client needs to keep its copy of them current.
  - name: instance
    description: The plugin instances of a project, with their content.
  - name: link
    description: The links between the items of a project.
  - name: plugin
    description: The published versions of each plugin, with their manifest, modules and translations.

paths:
  /v1/ping:
    get:
      operationId: ping
      summary: Ping the server.
      description: |
        Checks whether the server is up and running. It always returns the same response.

        Dependency health lives on the `/v1/healthcheck` endpoint.
      tags: [health]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/pong"
        default:
          $ref: "#/components/responses/internalError"

  /v1/healthcheck:
    get:
      operationId: healthcheck
      summary: Health diagnosis of the server.
      description: |
        Probes every server dependency and reports whether each one answered. Returns HTTP 200
        when every dependency is up, and HTTP 503 with the same report otherwise. `/v1/ping`
        checks the process alone.
      tags: [health]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/health"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/healthUnavailable"
        default:
          $ref: "#/components/responses/internalError"

  /v1/projects:
    post:
      operationId: projectCreate
      summary: Create a project.
      description: |
        Creates a project of the caller.
      tags: [project]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/projectCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/projectCreated"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "409":
          $ref: "#/components/responses/projectsFull"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/projects/fields/drift:
    post:
      operationId: projectFieldsDrift
      summary: Find the projects whose fields drifted.
      description: |
        Compares the fields of the projects a client holds with the caller's, and returns the drift. A project's
        fields are its own fields, from `id` to `updatedAt`, and its default instance. `updatedAt` changes only
        when they change.

        The request maps each project the client holds to its `updatedAt`. Instants compare to the millisecond, the
        precision a JavaScript date keeps, so two changes within one millisecond read as one until the next. The
        response holds every project of the caller that the request leaves out or names with another `updatedAt`,
        and `removed` lists every ID of the request that names no project of the caller. A client that applies both
        holds the caller's fields again. An empty map returns every project of the caller.

        A request names at most 100 projects, as many as a user owns. The drift carries no logo:
        `POST /v1/projects/logos/drift` compares the logos.
      tags: [project]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/projectFieldsDriftRequest"
      responses:
        "200":
          $ref: "#/components/responses/projectFieldsDrift"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/projects/edits:
    get:
      operationId: projectEditsList
      summary: List the edits of the caller's projects.
      description: |
        Returns the `editedAt` of every project of the caller, by ID: when its fields or its content last changed.
        The read is cheap, so a client runs it often to order the projects it holds, and to find a project it lacks
        or one it holds that is gone. `POST /v1/projects/fields/drift` then reads their fields.
      tags: [project]
      responses:
        "200":
          $ref: "#/components/responses/projectEdits"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/projects/logos/drift:
    post:
      operationId: projectLogosDrift
      summary: Find the logos that drifted.
      description: |
        Compares the logos a client holds with those of the caller's projects, by their checksum, the SHA-256 of
        the logo's stored bytes that `logoChecksum` carries, and returns the drift.

        The request maps each project whose logo the client holds to the logo's checksum, and leaves out a project
        the client holds without a logo. The response maps every project of the caller whose logo the request leaves
        out, or names with another checksum, to the logo's checksum. `removed` lists every ID of the request whose
        project is not the caller's or holds no logo now. The drift carries no bytes: `GET /v1/project/logo` reads a
        logo.

        A request names at most 100 logos, one for each project a user may own.
      tags: [project]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/projectLogosDriftRequest"
      responses:
        "200":
          $ref: "#/components/responses/projectLogosDrift"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/project:
    get:
      operationId: projectGet
      summary: Get a project.
      description: |
        Returns a project of the caller.
      tags: [project]
      parameters:
        - $ref: "#/components/parameters/projectID"
      responses:
        "200":
          $ref: "#/components/responses/project"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    put:
      operationId: projectUpdate
      summary: Update a project.
      description: |
        Replaces the title, premise, language, tags and genres of a project. `tags` and `genres` each replace
        their whole list, so a request that omits one is refused, and an empty list clears it.
      tags: [project]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/projectUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/project"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/projectBudget"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    delete:
      operationId: projectDelete
      summary: Delete a project.
      description: |
        Deletes a project, and returns the project as it was.
      tags: [project]
      parameters:
        - $ref: "#/components/parameters/projectID"
      responses:
        "200":
          $ref: "#/components/responses/project"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/project/logo:
    get:
      operationId: projectLogoGet
      summary: Get the logo of a project.
      description: |
        Returns the bytes of the logo of a project of the caller, with the media type it was stored with.

        The response's strong `ETag` is the logo's checksum, as the project's `logoChecksum` carries it, and its
        `Last-Modified` is when the logo last changed. A matching `If-None-Match` or `If-Modified-Since` answers 304.
        `Cache-Control: no-cache` makes a cache revalidate on every use: a client that caches for good does so
        under a URL that names the checksum.
      tags: [project]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
      responses:
        "200":
          $ref: "#/components/responses/projectLogo"
        "304":
          $ref: "#/components/responses/notModified"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    put:
      operationId: projectLogoUpdate
      summary: Set the logo of a project.
      description: |
        Replaces the logo of a project. The body is the encoded image. The server recognizes its format from
        the bytes, whatever `Content-Type` says, and accepts a still WebP, a JPEG or a still PNG that decodes
        whole, of any aspect ratio, at most 128 pixels tall and 256 KiB.

        It refuses any other logo with 422, naming the rule it broke. A
        logo is cosmetic: the write leaves the project's `editedAt` as it was, and the logo does not count in
        the project's stored bytes.
      tags: [project]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
      requestBody:
        required: true
        content:
          image/webp:
            schema:
              type: string
              contentMediaType: image/webp
          image/jpeg:
            schema:
              type: string
              contentMediaType: image/jpeg
          image/png:
            schema:
              type: string
              contentMediaType: image/png
      responses:
        "200":
          $ref: "#/components/responses/project"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "413":
          $ref: "#/components/responses/contentTooLarge"
        "422":
          $ref: "#/components/responses/pictureRefused"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    delete:
      operationId: projectLogoDelete
      summary: Remove the logo of a project.
      description: |
        Removes the logo of a project, and returns the project. A project without a logo stays as it is. A logo
        is cosmetic, so the removal leaves the project's `editedAt` as it was.
      tags: [project]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
      responses:
        "200":
          $ref: "#/components/responses/project"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/project/default:
    put:
      operationId: projectDefaultUpdate
      summary: Choose the default instance of a project.
      description: |
        Makes an instance of a project its default, the one the project opens on, and returns the project. The
        first instance of a project becomes its default without this call.

        The default is a field of the project: the choice stamps the project's `updatedAt`, so the fields drift
        reports it, and its `editedAt`.
      tags: [project]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/projectDefaultUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/project"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/instanceNotFound"
        "413":
          $ref: "#/components/responses/contentTooLarge"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/instances:
    get:
      operationId: instanceList
      summary: List the instances of a project.
      description: |
        Returns a page of the instances of a project of the caller, oldest first, without their content. The
        page comes with how many instances the project holds in all. To read the next page, raise `offset` by
        the instances received, while that stays below the total. A project holds 50 instances at most by
        default, so one page of the default size holds them all.
      tags: [instance]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
        - $ref: "#/components/parameters/composerLimit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/instancePage"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    post:
      operationId: instancesCreate
      summary: Create instances in a project.
      description: |
        Creates instances in a project, all of them or none, and returns them in the order of the request,
        without their content. A client seeds a new project with it. The first instance of a project becomes
        its default, which changes the project's `updatedAt`.

        The request holds as many instances at most as a project does, 50 by default. Each content follows the
        rules of `POST /v1/instance`.

        It writes documents, so each signed-in user sends it 3 requests a minute by default, on top of the
        rate of every route. One more answers 429 with `Retry-After`.
      tags: [instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/instancesCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/instancesCreated"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/instancesFull"
        "413":
          $ref: "#/components/responses/batchTooLarge"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/instance:
    get:
      operationId: instanceGet
      summary: Get an instance.
      description: |
        Returns an instance of a project of the caller, with its content.
      tags: [instance]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
        - $ref: "#/components/parameters/instanceID"
      responses:
        "200":
          $ref: "#/components/responses/instance"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/instanceNotFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    post:
      operationId: instanceCreate
      summary: Create an instance in a project.
      description: |
        Creates an instance in a project, and returns it without its content. The first instance of a project
        becomes its default, which changes the project's `updatedAt`.

        The service checks the format of `plugin` and of `version`, never that the registry holds them. It
        stores `content` as it is, any JSON value, and refuses it with 422 when it is over 4 MiB or nests its
        arrays and objects deeper than 32 levels. Both limits are the defaults of the service's
        configuration. A number counts toward the size as PostgreSQL stores it, written in full: its exponent
        adds as many bytes, so `1e400` counts 405.

        It also refuses with 422 what PostgreSQL does not store: the NUL character (`\u0000`) or half of a
        surrogate pair (`\ud83d` without its `\ude00`) in a string, and a number of more than 16383 digits,
        its exponent written out.

        It writes a document, so each signed-in user sends it 3 requests a minute by default, on top of the
        rate of every route. One more answers 429 with `Retry-After`.
      tags: [instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/instanceCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/instanceCreated"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/instancesFull"
        "413":
          $ref: "#/components/responses/contentTooLarge"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    put:
      operationId: instanceUpdate
      summary: Rename an instance.
      description: |
        Replaces the display name of an instance, and returns the instance without its content. An empty
        name clears it. The name is the one field of an instance a writer edits outside its plugin.

        A rename leaves the instance's `updatedAt` as it was, so it refuses no write of the content.
      tags: [instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/instanceUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/instanceDescriptor"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/instanceNotFound"
        "409":
          $ref: "#/components/responses/projectBudget"
        "413":
          $ref: "#/components/responses/contentTooLarge"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    delete:
      operationId: instanceDelete
      summary: Delete an instance.
      description: |
        Deletes an instance and its content, and returns the instance without its content.

        The default instance of a project cannot be deleted: the request answers 409 until
        `PUT /v1/project/default` chooses another. The links that name the instance stay, and the client prunes
        them.
      tags: [instance]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
        - $ref: "#/components/parameters/instanceID"
      responses:
        "200":
          $ref: "#/components/responses/instanceDescriptor"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/instanceNotFound"
        "409":
          $ref: "#/components/responses/instanceDefault"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/instance/content:
    put:
      operationId: instanceContentUpdate
      summary: Write the content of an instance.
      description: |
        Replaces the version and the content of an instance in one write, and returns the instance without its
        content. A client that migrates the content writes the version it migrated to.

        The write applies only while the instance still carries the `updatedAt` the request names. Once
        another write changed the instance, it answers 409 and changes nothing: the client reads the instance
        again. The response carries the new `updatedAt`, which the next write names.

        `content` follows the rules of `POST /v1/instance`.

        It writes a document, so each signed-in user sends it 3 requests a minute by default, on top of the
        rate of every route. One more answers 429 with `Retry-After`: a client keeps the writer's edits itself
        and saves them at intervals.
      tags: [instance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/instanceContentUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/instanceDescriptor"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/instanceNotFound"
        "409":
          $ref: "#/components/responses/staleWrite"
        "413":
          $ref: "#/components/responses/contentTooLarge"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/links:
    get:
      operationId: projectLinksGet
      summary: Get the links of a project.
      description: |
        Returns the links of a project of the caller, and when they last changed. A project that never wrote
        its links returns an empty list and a null `updatedAt`.
      tags: [link]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
      responses:
        "200":
          $ref: "#/components/responses/projectLinks"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    put:
      operationId: projectLinksUpdate
      summary: Write the links of a project.
      description: |
        Replaces the links of a project in one write, and returns their new `updatedAt`. An empty list clears
        them, and a request that omits the list is refused.

        The write applies only while the links still carry the `updatedAt` the request names: null, or
        omitted, for a project that never wrote its links. Once another write changed them, it answers 409 and
        changes nothing: the client reads the links again.

        The service checks the shape and the size of the links, never that an instance or an item they name
        exists. By default a project holds 20,000 links at most, of 2 MiB once the service encodes them, a
        target holds 200 characters and a relationship 1 KiB. Links past a limit, or holding the NUL character
        in a text, answer 422.

        It writes a document, so each signed-in user sends it 3 requests a minute by default, on top of the
        rate of every route. One more answers 429 with `Retry-After`.
      tags: [link]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/projectLinksUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/projectLinksWritten"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/staleWrite"
        "413":
          $ref: "#/components/responses/contentTooLarge"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/plugins:
    get:
      operationId: pluginList
      summary: List the plugins of the registry.
      description: |
        Returns a page of the registry's plugins, by name. Each comes with its latest release, and its title and
        description in the language asked for, or in English when that release is not translated in it. The
        page comes with how many plugins the registry lists in all. A plugin that only has prereleases is left
        out. To read the next page, raise `offset` by the plugins received, while that stays below the total.
      tags: [plugin]
      parameters:
        - $ref: "#/components/parameters/pluginListLanguage"
        - $ref: "#/components/parameters/composerLimit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/pluginPage"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/plugin/version:
    get:
      operationId: pluginManifestGet
      summary: Get the manifest of a version of a plugin.
      description: |
        Returns the manifest of one version of a plugin, a prerelease included: the schema its content follows,
        its exports, whether it ships a migration, and the checksums of its schema and of its UI module. The
        modules and the translations have their own routes.
      tags: [plugin]
      parameters:
        - $ref: "#/components/parameters/pluginName"
        - $ref: "#/components/parameters/pluginVersion"
      responses:
        "200":
          $ref: "#/components/responses/pluginManifest"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/pluginNotFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/plugin/version/ui:
    get:
      operationId: pluginUIGet
      summary: Get the UI module of a version of a plugin.
      description: |
        Returns the JavaScript module that renders one version of a plugin.

        The response's strong `ETag` is the module's checksum, as the manifest's `uiChecksum` carries it, and its
        `Last-Modified` is when the version was published. A matching `If-None-Match` or `If-Modified-Since`
        answers 304. A published version never changes, so `Cache-Control` marks the module immutable for a
        year, in the caller's own cache.
      tags: [plugin]
      parameters:
        - $ref: "#/components/parameters/pluginName"
        - $ref: "#/components/parameters/pluginVersion"
      responses:
        "200":
          $ref: "#/components/responses/pluginModule"
        "304":
          $ref: "#/components/responses/pluginModuleNotModified"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/pluginNotFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/plugin/version/migration:
    get:
      operationId: pluginMigrationGet
      summary: Get the migration module of a version of a plugin.
      description: |
        Returns the JavaScript module that brings content from the previous version of a plugin to this one. A
        version ships one only when its manifest's `hasMigration` is true, and answers 404 otherwise.

        The response carries the same `ETag`, `Last-Modified` and `Cache-Control` as the UI module, and answers
        a conditional request the same way.
      tags: [plugin]
      parameters:
        - $ref: "#/components/parameters/pluginName"
        - $ref: "#/components/parameters/pluginVersion"
      responses:
        "200":
          $ref: "#/components/responses/pluginModule"
        "304":
          $ref: "#/components/responses/pluginModuleNotModified"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/pluginNotFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/plugin/version/messages:
    get:
      operationId: pluginMessagesGet
      summary: Get the translations of a version of a plugin.
      description: |
        Returns the translations of one version of a plugin in one language: its title, its description and
        its messages. The route reads that language alone, and answers 404 when the version is not translated
        in it. Every version is translated in English, which a client reads to fill the keys another language
        lacks.
      tags: [plugin]
      parameters:
        - $ref: "#/components/parameters/pluginName"
        - $ref: "#/components/parameters/pluginVersion"
        - $ref: "#/components/parameters/pluginMessagesLanguage"
      responses:
        "200":
          $ref: "#/components/responses/pluginMessages"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/pluginNotFound"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/plugin/versions:
    get:
      operationId: pluginVersionList
      summary: List the releases of a plugin after a version.
      description: |
        Returns a page of the releases of a plugin that come after a version, oldest first: the steps of an
        upgrade from that version. Each step tells whether it ships a migration, and carries the checksum of
        its schema, so a client fetches a schema only where the checksum changes. The page comes with how many
        releases come after the version in all.

        A prerelease is never a step. The release of a version comes after its prereleases, so `1.2.0` follows
        `1.2.0-dev.1`. The registry need not hold the version the request names, and a plugin it lacks has no
        release: both answer a page, which may be empty.
      tags: [plugin]
      parameters:
        - $ref: "#/components/parameters/pluginName"
        - $ref: "#/components/parameters/pluginAfter"
        - $ref: "#/components/parameters/composerLimit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/pluginVersionPage"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "422":
          $ref: "#/components/responses/unprocessableEntity"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

components:
  responses:
    pong:
      description: Server is alive.
      content:
        text/plain:
          schema:
            type: string
            examples: [pong]

    health:
      description: All server dependencies are healthy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/healthReport"
          examples:
            healthy:
              value: { "client:postgres": { "status": "up" }, "api:jsonKeys": { "status": "up" } }

    healthUnavailable:
      description: |
        At least one dependency probe failed. During a planned downtime, the body is a problem
        tagged `downtime` instead.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/plannedDowntimeProblem"
        application/json:
          schema:
            $ref: "#/components/schemas/healthReport"
          examples:
            degraded:
              value: { "client:postgres": { "status": "up" }, "api:jsonKeys": { "status": "down" } }

    plannedDowntime:
      description: |
        The service is in a planned downtime and refuses work until operators end it. The platform
        reads the announced window from the downtime document infra publishes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/plannedDowntimeProblem"

    project:
      description: A project.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/project"

    instanceDescriptor:
      description: An instance, without its content.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/instanceDescriptor"

    instancePage:
      description: A page of the instances of the project, oldest first, without their content, with their total.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/instancePage"

    instance:
      description: An instance, with its content.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/instance"

    instanceCreated:
      description: The new instance, without its content.
      headers:
        Location:
          description: The read of the new instance.
          schema:
            type: string
            examples:
              - /v1/instance?projectID=01920000-0000-7000-8000-000000000001&id=01920000-0000-7000-8000-000000000031
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/instanceDescriptor"

    instancesCreated:
      description: The new instances, in the order of the request, without their content.
      headers:
        Location:
          description: The list of the project's instances.
          schema:
            type: string
            examples: [/v1/instances?projectID=01920000-0000-7000-8000-000000000001]
      content:
        application/json:
          schema:
            type: array
            description: The new instances.
            items:
              $ref: "#/components/schemas/instanceDescriptor"

    projectLinks:
      description: The links of the project, and when they last changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/projectLinks"

    projectLinksWritten:
      description: When the write replaced the links, which the next write names.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/projectLinksWritten"

    projectFieldsDrift:
      description: The projects whose fields drifted, and the IDs of the request that name no project of the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/projectFieldsDrift"

    projectEdits:
      description: The `editedAt` of every project of the caller, by ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/projectEdits"

    projectLogosDrift:
      description: The logos that drifted, and the IDs of the request whose project holds no logo of the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/projectLogosDrift"

    projectLogo:
      description: The encoded logo, as its owner sent it.
      headers:
        ETag:
          description: The strong validator of the logo, its checksum in quotes.
          schema:
            type: string
            examples: ['"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"']
        Last-Modified:
          description: When the logo last changed, to the second.
          schema:
            type: string
            examples: ["Wed, 04 Nov 2026 08:15:30 GMT"]
        Cache-Control:
          description: Always `no-cache`, so a cache revalidates the logo on every use.
          schema:
            type: string
            const: no-cache
        X-Content-Type-Options:
          description: Always `nosniff`, so a browser keeps the stored media type.
          schema:
            type: string
            const: nosniff
      content:
        image/webp:
          schema:
            type: string
            contentMediaType: image/webp
        image/jpeg:
          schema:
            type: string
            contentMediaType: image/jpeg
        image/png:
          schema:
            type: string
            contentMediaType: image/png

    notModified:
      description: The logo matches the request's `If-None-Match` or `If-Modified-Since`. The response has no body.
      headers:
        ETag:
          description: The strong validator of the logo, its checksum in quotes.
          schema:
            type: string
        Cache-Control:
          description: Always `no-cache`.
          schema:
            type: string
            const: no-cache

    projectCreated:
      description: The new project.
      headers:
        Location:
          description: The read of the new project.
          schema:
            type: string
            examples: [/v1/project?id=00000000-0000-0000-0000-000000000001]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/project"

    pluginPage:
      description: A page of the registry's plugins, by name, with their total.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/pluginPage"

    pluginManifest:
      description: The manifest of a version of a plugin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/pluginManifest"

    pluginModule:
      description: The source of the module, as it was published.
      headers:
        ETag:
          description: The strong validator of the module, its checksum in quotes.
          schema:
            type: string
            examples: ['"9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"']
        Last-Modified:
          description: When the module's version was published, to the second.
          schema:
            type: string
            examples: ["Thu, 19 Nov 2026 08:15:30 GMT"]
        Cache-Control:
          description: Always the same, since a published module never changes. A private cache keeps it for a year.
          schema:
            type: string
            const: private, max-age=31536000, immutable
        X-Content-Type-Options:
          description: Always `nosniff`, so a browser reads the module as JavaScript.
          schema:
            type: string
            const: nosniff
      content:
        text/javascript:
          schema:
            type: string
            contentMediaType: text/javascript

    pluginModuleNotModified:
      description: The module matches the request's `If-None-Match` or `If-Modified-Since`. The response has no body.
      headers:
        ETag:
          description: The strong validator of the module, its checksum in quotes.
          schema:
            type: string
        Cache-Control:
          description: The same as on the module itself.
          schema:
            type: string
            const: private, max-age=31536000, immutable

    pluginMessages:
      description: The translations of a version of a plugin in one language.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/pluginMessages"

    pluginVersionPage:
      description: A page of the releases of a plugin after a version, oldest first, with their total.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/pluginVersionPage"

    pluginNotFound:
      description: |
        The registry holds no such version of the plugin, the version ships without the module, or it is not
        translated in the language.

    badRequest:
      description: |
        The request could not be parsed, such as malformed JSON, or a parameter or header of the wrong type.
      content:
        text/plain:
          schema:
            type: string
            examples: [Bad Request]

    invalidToken:
      description: |
        The bearer token is missing or invalid, for instance expired. Refresh the session or sign in again.

    forbidden:
      description: |
        The session lacks the permission this route requires, such as an anonymous session, which owns no
        project.

    notFound:
      description: |
        The caller owns no such project, or the project holds no logo.

    instanceNotFound:
      description: |
        The caller owns no such project, or the project holds no such instance.

    contentTooLarge:
      description: The body is over the limit of a route that writes one item, 5 MiB by default.

    batchTooLarge:
      description: |
        The body is over the limit of every route, 20 MiB by default: above the 16 MiB a project stores, so a
        batch it refuses could not be stored.

    unprocessableEntity:
      description: |
        The request was understood by the server, but cannot be processed because the data did not pass
        required validation. The problem names each invalid field and the rule it broke.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/invalidRequest"

    pictureRefused:
      description: |
        The request did not pass validation, as for `unprocessableEntity`, or the logo breaks the contract, as
        the problem's `reason` tag names.
      content:
        application/problem+json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/invalidRequest"
              - $ref: "#/components/schemas/pictureRefusedProblem"

    projectBudget:
      description: |
        The write would bring the project past its 16 MiB budget of stored bytes, and nothing was written. The
        problem's `limit` tag is `projectBytes`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/limitProblem"

    instancesFull:
      description: |
        The project would hold more instances than it may, 50 by default, or pass its 16 MiB budget of stored
        bytes, and nothing was created. The problem's `limit` tag is `instances` or `projectBytes`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/limitProblem"

    instanceDefault:
      description: |
        The instance is the default of its project, and nothing was deleted. `PUT /v1/project/default` chooses
        another first.
      content:
        text/plain:
          schema:
            type: string
            examples: [Conflict]

    staleWrite:
      description: |
        Nothing was written, for one of two reasons. The document changed since the client read it: the body
        is plain text, and the client reads the document again. Or the write would bring the project past its
        16 MiB budget of stored bytes: the body is a problem whose `limit` tag is `projectBytes`.
      content:
        text/plain:
          schema:
            type: string
            examples: [Conflict]
        application/problem+json:
          schema:
            $ref: "#/components/schemas/limitProblem"

    projectsFull:
      description: |
        The caller already owns 100 projects, as many as a user may, and nothing was created. The problem's
        `limit` tag is `projects`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/limitProblem"

    tooManyRequests:
      description: |
        The caller sent too many requests to this route. Retry once `Retry-After` has elapsed.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer

    internalError:
      description: Something unexpected happened.

  schemas:
    invalidRequest:
      type: object
      description: |
        An RFC 9457 problem details body whose tags name the request fields that failed validation. Field
        paths and rule codes come from the API definition, never from the submitted values.
      required: [type, title, status, tags]
      additionalProperties: false
      properties:
        type:
          type: string
          description: The problem type; about:blank makes the title the HTTP status text.
          const: about:blank
        title:
          type: string
          description: The HTTP status text.
          examples: [Unprocessable Entity]
        status:
          type: integer
          description: The HTTP status code.
          const: 422
        tags:
          type: object
          description: Public details about the failure. Clients ignore tags they do not know.
          required: [invalidFields]
          additionalProperties: true
          properties:
            invalidFields:
              type: object
              description: |
                Maps the path of each invalid field, in lower camel case with `.` for nesting and `[i]` for a
                list item, to the validation rule it broke. Standard rules carry their usual name (required,
                max); service rules name a domain check (notblank).

                A document or a text past a configured limit names it: `maxbytes` for one over its size in
                bytes, `max` for a list over its items or a text over its characters, `maxdepth` for a document
                nested too deep. A document that is not JSON in UTF-8 breaks `json`. One that holds what
                PostgreSQL does not store names it: `nonul` for the NUL character in a string,
                `nolonesurrogate` for half of a surrogate pair in a string, `maxdigits` for a number of more
                than 16383 digits.
              additionalProperties:
                type: string
              examples:
                - { "title": "notblank" }
                - { "content": "maxbytes" }

    projectID:
      type: string
      description: The unique identifier of a project.
      format: uuid
      examples: ["01920000-0000-7000-8000-000000000001"]

    language:
      type: string
      description: The language the project is written in, as a BCP 47 tag.
      enum: [en, fr]
      examples: [fr]

    project:
      type: object
      description: One narrative, written in one language.
      required: [id, title, premise, language, tags, genres, createdAt, updatedAt, editedAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/projectID"
        title:
          type: string
          description: The title of the project.
          examples: ["Les Heures claires"]
        premise:
          type: string
          description: What the narrative is about, in a few sentences. Empty until the author writes one.
          examples: ["Marie attend un homme qui ne viendra pas."]
        language:
          $ref: "#/components/schemas/language"
        tags:
          type: array
          description: The author's custom labels, in order. Empty until the author adds one.
          items:
            type: string
            description: A label of 1 to 24 characters, in lower kebab case.
          examples: [["noir", "huis-clos"]]
        genres:
          type: array
          description: The genres the author names, in order. Empty until the author adds one.
          items:
            type: string
            description: A genre of 1 to 24 characters.
          examples: [["thriller", "roman noir"]]
        createdAt:
          type: string
          description: When the project was created.
          format: date-time
          examples: ["2021-01-01T00:00:00Z"]
        updatedAt:
          type: string
          description: |
            When the project's own fields, its title, premise, language, tags, genres and default instance, last
            changed.
          format: date-time
          examples: ["2021-01-02T00:00:00Z"]
        editedAt:
          type: string
          description: |
            When the project's content last changed. Its logo is cosmetic and leaves it as it was.
          format: date-time
          examples: ["2021-01-03T00:00:00Z"]
        defaultInstanceID:
          description: |
            The instance the project opens on. Absent until the project holds an instance: the first one becomes
            it, and `PUT /v1/project/default` chooses another.
          $ref: "#/components/schemas/instanceID"
        logoChecksum:
          type: string
          description: |
            The checksum of the logo: the SHA-256 of its stored bytes, in lowercase hex. Absent while the project has
            no logo. A logo URL that carries it names the logo's bytes, so a cache keeps each logo for good.
          pattern: "^[0-9a-f]{64}$"
          examples: ["9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"]

    projectFields:
      type: object
      description: |
        The fields of a project, its default instance among them, with its `editedAt` so a project the client lacks
        arrives whole. It carries no logo.
      required: [id, title, premise, language, tags, genres, createdAt, updatedAt, editedAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/projectID"
        title:
          $ref: "#/components/schemas/project/properties/title"
        premise:
          $ref: "#/components/schemas/project/properties/premise"
        language:
          $ref: "#/components/schemas/language"
        tags:
          $ref: "#/components/schemas/project/properties/tags"
        genres:
          $ref: "#/components/schemas/project/properties/genres"
        createdAt:
          $ref: "#/components/schemas/project/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/project/properties/updatedAt"
        editedAt:
          $ref: "#/components/schemas/project/properties/editedAt"
        defaultInstanceID:
          $ref: "#/components/schemas/project/properties/defaultInstanceID"

    projectFieldsDriftRequest:
      type: object
      description: The projects a client holds.
      required: [projects]
      additionalProperties: false
      properties:
        projects:
          type: object
          description: |
            Maps the ID of each project the client holds to its `updatedAt`. Instants compare to the millisecond,
            so a client may hold it as a date of that precision. Empty when the client holds none.
          maxProperties: 100
          propertyNames:
            $ref: "#/components/schemas/projectID"
          additionalProperties:
            $ref: "#/components/schemas/project/properties/updatedAt"
          examples:
            - { "01920000-0000-7000-8000-000000000001": "2026-11-04T08:15:30.123456Z" }

    projectFieldsDrift:
      type: object
      description: The drift between the projects a client holds and the caller's.
      required: [projects, removed]
      additionalProperties: false
      properties:
        projects:
          type: array
          description: Every project of the caller that the request leaves out, or names with another `updatedAt`.
          items:
            $ref: "#/components/schemas/projectFields"
        removed:
          type: array
          description: Every ID of the request that names no project of the caller.
          items:
            $ref: "#/components/schemas/projectID"

    projectEdits:
      type: object
      description: The `editedAt` of every project of the caller.
      required: [edits]
      additionalProperties: false
      properties:
        edits:
          type: object
          description: Maps the ID of each project of the caller to its `editedAt`.
          maxProperties: 100
          propertyNames:
            $ref: "#/components/schemas/projectID"
          additionalProperties:
            $ref: "#/components/schemas/project/properties/editedAt"
          examples:
            - { "01920000-0000-7000-8000-000000000001": "2026-11-04T08:15:30.123456Z" }

    projectLogosDriftRequest:
      type: object
      description: The logos a client holds.
      required: [logos]
      additionalProperties: false
      properties:
        logos:
          type: object
          description: |
            Maps the ID of each project whose logo the client holds to the logo's `logoChecksum`. Empty when the client
            holds none.
          maxProperties: 100
          propertyNames:
            $ref: "#/components/schemas/projectID"
          additionalProperties:
            $ref: "#/components/schemas/project/properties/logoChecksum"
          examples:
            - {
                "01920000-0000-7000-8000-000000000001": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08",
              }

    projectLogosDrift:
      type: object
      description: The drift between the logos a client holds and those of the caller's projects.
      required: [logos, removed]
      additionalProperties: false
      properties:
        logos:
          type: object
          description: |
            Maps every project of the caller whose logo the request leaves out, or names with another checksum, to the
            logo's `logoChecksum`.
          maxProperties: 100
          propertyNames:
            $ref: "#/components/schemas/projectID"
          additionalProperties:
            $ref: "#/components/schemas/project/properties/logoChecksum"
        removed:
          type: array
          description: Every ID of the request whose project is not the caller's or holds no logo now.
          items:
            $ref: "#/components/schemas/projectID"

    projectCreateRequest:
      type: object
      description: The project to create.
      required: [title, language]
      additionalProperties: false
      examples:
        - { "title": "Les Heures claires", "language": "fr" }
      properties:
        title:
          type: string
          description: The title of the project. Not blank.
          maxLength: 80
          examples: ["Les Heures claires"]
        premise:
          type: string
          description: What the narrative is about.
          maxLength: 20000
          examples: ["Marie attend un homme qui ne viendra pas."]
        language:
          $ref: "#/components/schemas/language"
        tags:
          type: array
          description: The author's custom labels, in order, each appearing once. None when omitted.
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            description: |
              A label of 1 to 24 characters in lower kebab case: words from any script joined by single
              hyphens. A word starts with a lowercase letter or a digit and holds the marks and zero-width
              joiners inside it. The tag is precomposed (NFC).
            minLength: 1
            maxLength: 24
            pattern: '^[\p{Ll}\p{Lm}\p{Lo}\p{Nd}](?:[\p{Ll}\p{Lm}\p{Lo}\p{Nd}\p{M}\u200C\u200D]*[\p{Ll}\p{Lm}\p{Lo}\p{Nd}\p{M}])?(?:-[\p{Ll}\p{Lm}\p{Lo}\p{Nd}](?:[\p{Ll}\p{Lm}\p{Lo}\p{Nd}\p{M}\u200C\u200D]*[\p{Ll}\p{Lm}\p{Lo}\p{Nd}\p{M}])?)*$'
          examples: [["noir", "huis-clos", "années-50"]]
        genres:
          type: array
          description: The genres the author names, in order, each appearing once. None when omitted.
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            description: A genre of 1 to 24 characters, with no whitespace at either end.
            minLength: 1
            maxLength: 24
          examples: [["thriller", "roman noir"]]

    projectUpdateRequest:
      type: object
      description: The new fields of a project.
      required: [id, title, language, tags, genres]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/projectID"
        title:
          $ref: "#/components/schemas/projectCreateRequest/properties/title"
        premise:
          $ref: "#/components/schemas/projectCreateRequest/properties/premise"
        language:
          $ref: "#/components/schemas/language"
        tags:
          $ref: "#/components/schemas/projectCreateRequest/properties/tags"
        genres:
          $ref: "#/components/schemas/projectCreateRequest/properties/genres"

    instanceID:
      type: string
      description: The unique identifier of an instance.
      format: uuid
      examples: ["01920000-0000-7000-8000-000000000031"]

    instant:
      type: string
      description: |
        When a document last changed, in RFC 3339 with the microseconds the service stores. A write of the
        document sends it back as the text it received: a JavaScript date drops its last three digits, and the
        write then answers 409.
      format: date-time
      examples: ["2021-01-03T08:15:30.123456Z"]

    instanceName:
      type: string
      description: |
        The display name the writer gives the instance. Empty when the writer gives none: the client then shows
        a name of its own. A name of only whitespace is refused.
      maxLength: 80
      examples: ["Composer", ""]

    instanceVersion:
      type: string
      description: |
        The exact version of the plugin the content follows: a semantic version without build metadata, a
        prerelease included. The service checks its format, never that the registry holds it.
      maxLength: 256
      examples: ["1.2.0", "2.0.0-dev.1"]

    document:
      description: |
        A JSON document the client owns: any JSON value. The service stores it without reading what it means.
        PostgreSQL stores it as `jsonb`, so a read returns its values with another spacing, the keys of its
        objects in another order, and its numbers in another spelling.
      examples:
        - { "beats": [] }

    instanceDescriptor:
      type: object
      description: What a project knows of an instance without reading its content.
      required: [id, projectID, plugin, version, name, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/instanceID"
        projectID:
          $ref: "#/components/schemas/projectID"
        plugin:
          $ref: "#/components/schemas/pluginName"
        version:
          $ref: "#/components/schemas/instanceVersion"
        name:
          $ref: "#/components/schemas/instanceName"
        createdAt:
          type: string
          description: When the instance was created.
          format: date-time
          examples: ["2021-01-01T00:00:00Z"]
        updatedAt:
          description: |
            When the version or the content of the instance last changed. A rename leaves it as it was.
          $ref: "#/components/schemas/instant"

    instancePage:
      type: object
      description: A page of the instances of a project, oldest first.
      required: [instances, total]
      additionalProperties: false
      properties:
        instances:
          type: array
          description: The instances of the page, without their content.
          items:
            $ref: "#/components/schemas/instanceDescriptor"
        total:
          type: integer
          description: |
            How many instances the project holds in all, so a client paging through them knows when it holds
            them all. A page past the end reports 0.
          minimum: 0
          examples: [3]

    instance:
      type: object
      description: One use of a plugin in a project, with its content.
      required: [id, projectID, plugin, version, name, createdAt, updatedAt, content]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/instanceID"
        projectID:
          $ref: "#/components/schemas/projectID"
        plugin:
          $ref: "#/components/schemas/pluginName"
        version:
          $ref: "#/components/schemas/instanceVersion"
        name:
          $ref: "#/components/schemas/instanceName"
        createdAt:
          $ref: "#/components/schemas/instanceDescriptor/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/instanceDescriptor/properties/updatedAt"
        content:
          description: The document the plugin edits.
          $ref: "#/components/schemas/document"

    instanceCreateRequest:
      type: object
      description: The instance to create. Omitted, its name is empty.
      required: [projectID, plugin, version, content]
      additionalProperties: false
      examples:
        - projectID: "01920000-0000-7000-8000-000000000001"
          plugin: scenes-composer
          version: "1.2.0"
          name: Composer
          content: { "beats": [] }
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        plugin:
          $ref: "#/components/schemas/pluginName"
        version:
          $ref: "#/components/schemas/instanceVersion"
        name:
          $ref: "#/components/schemas/instanceName"
        content:
          description: The document the plugin edits.
          $ref: "#/components/schemas/document"

    instancesCreateRequest:
      type: object
      description: The instances to create in a project.
      required: [projectID, instances]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        instances:
          type: array
          description: The instances to create, as many at most as a project holds, 50 by default.
          minItems: 1
          items:
            type: object
            description: One instance to create. Omitted, its name is empty.
            required: [plugin, version, content]
            additionalProperties: false
            properties:
              plugin:
                $ref: "#/components/schemas/pluginName"
              version:
                $ref: "#/components/schemas/instanceVersion"
              name:
                $ref: "#/components/schemas/instanceName"
              content:
                description: The document the plugin edits.
                $ref: "#/components/schemas/document"

    instanceUpdateRequest:
      type: object
      description: The new name of an instance. Omitted or empty, the instance has none.
      required: [projectID, id]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        id:
          $ref: "#/components/schemas/instanceID"
        name:
          $ref: "#/components/schemas/instanceName"

    instanceContentUpdateRequest:
      type: object
      description: The new version and content of an instance.
      required: [projectID, id, version, content, updatedAt]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        id:
          $ref: "#/components/schemas/instanceID"
        version:
          $ref: "#/components/schemas/instanceVersion"
        content:
          description: The document the plugin edits.
          $ref: "#/components/schemas/document"
        updatedAt:
          description: The `updatedAt` the instance carried when the client read it.
          $ref: "#/components/schemas/instant"

    projectDefaultUpdateRequest:
      type: object
      description: The instance a project opens on.
      required: [projectID, instanceID]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        instanceID:
          description: The instance that becomes the default of the project, which holds it.
          $ref: "#/components/schemas/instanceID"

    linkIdentifier:
      type: object
      description: One end of a link, which addresses an item of the project.
      required: [id, target]
      additionalProperties: false
      properties:
        id:
          description: The instance that holds the item. The service never checks that it exists.
          $ref: "#/components/schemas/instanceID"
        target:
          type: string
          description: |
            The address of the item inside that instance, which only plugins read. Not empty, and 200
            characters at most by default.
          minLength: 1
          examples: ["scenes/01920000-0000-7000-8000-0000000000a1"]

    link:
      type: object
      description: A relation between two items of one project.
      required: [source, destination, relationship]
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/linkIdentifier"
        destination:
          $ref: "#/components/schemas/linkIdentifier"
        relationship:
          type: string
          description: |
            What the source is to the destination, in the words of the plugin that wrote the link. 1 KiB at
            most by default, and empty when omitted.
          examples: ["therefore"]

    projectLinks:
      type: object
      description: The links of a project, which it stores and replaces whole.
      required: [links, updatedAt]
      additionalProperties: false
      properties:
        links:
          type: array
          description: The links of the project. Empty until the project writes some.
          items:
            $ref: "#/components/schemas/link"
        updatedAt:
          description: When the links last changed. Null for a project that never wrote its links.
          oneOf:
            - $ref: "#/components/schemas/instant"
            - type: "null"

    projectLinksUpdateRequest:
      type: object
      description: The new links of a project.
      required: [projectID, links]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        links:
          type: array
          description: The links that replace those of the project, 20,000 at most by default.
          items:
            $ref: "#/components/schemas/link"
        updatedAt:
          description: |
            The `updatedAt` the links carried when the client read them. Null or omitted for a project that
            never wrote its links.
          oneOf:
            - $ref: "#/components/schemas/instant"
            - type: "null"

    projectLinksWritten:
      type: object
      description: When a write replaced the links of a project.
      required: [updatedAt]
      additionalProperties: false
      properties:
        updatedAt:
          $ref: "#/components/schemas/instant"

    limitProblem:
      type: object
      description: |
        An RFC 9457 problem details body answering a write refused for a storage limit of the project or of the
        caller. Clients ignore extension members they do not know.
      required: [type, title, status, tags]
      additionalProperties: true
      properties:
        type:
          type: string
          description: The problem type; about:blank makes the title the HTTP status text.
          const: about:blank
        title:
          type: string
          description: The HTTP status text.
          examples: [Conflict]
        status:
          type: integer
          description: The HTTP status code.
          const: 409
        tags:
          type: object
          description: Public details about the refusal. Clients ignore tags they do not know.
          required: [limit]
          additionalProperties: true
          properties:
            limit:
              type: string
              description: |
                The limit the request reached: `projectBytes` for the 16 MiB a project stores, `projects` for the
                100 projects a user owns, `instances` for the instances a project holds, 50 by default.
              enum: [projectBytes, projects, instances]
              examples: [projectBytes]

    pictureRefusedProblem:
      type: object
      description: An RFC 9457 problem details body whose `reason` tag names the rule a refused logo broke.
      required: [type, title, status, tags]
      additionalProperties: false
      properties:
        type:
          type: string
          description: The problem type; about:blank makes the title the HTTP status text.
          const: about:blank
        title:
          type: string
          description: The HTTP status text.
          examples: [Unprocessable Entity]
        status:
          type: integer
          description: The HTTP status code.
          const: 422
        tags:
          type: object
          description: Public details about the failure. Clients ignore tags they do not know.
          required: [reason]
          additionalProperties: true
          properties:
            reason:
              type: string
              description: |
                The rule the logo broke: `format` for bytes that are neither a still WebP, a JPEG nor a still PNG,
                or do not decode whole; `dimensions` for a side under 1 pixel, or a logo past its tallest; `size` for a
                logo past its largest size, in bytes.
              enum: [format, dimensions, size]

    plannedDowntimeProblem:
      type: object
      description: |
        An RFC 9457 problem details body answering a request refused during a planned downtime. Clients
        ignore extension members they do not know.
      required: [type, title, status, tags]
      additionalProperties: true
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          const: 503
        tags:
          type: object
          required: [downtime]
          properties:
            downtime:
              type: boolean
              const: true
    healthReport:
      type: object
      description: |
        The status of each dependency. Every dependency must be up for HTTP 200.
      required: ["client:postgres", "api:jsonKeys"]
      additionalProperties:
        $ref: "#/components/schemas/healthStatus"
      properties:
        "client:postgres":
          $ref: "#/components/schemas/healthStatus"
        "api:jsonKeys":
          $ref: "#/components/schemas/healthStatus"
    healthStatus:
      type: object
      description: |
        The status of one dependency, as the server observed it. The endpoint is unauthenticated,
        so the entry carries the state alone. Diagnostics stay on server-side traces.
      required: [status]
      additionalProperties: false
      examples:
        - { "status": "up" }
        - { "status": "down" }
      properties:
        status:
          type: string
          description: Whether the server reached the dependency.
          enum: [up, down]

    pluginName:
      type: string
      description: |
        The name of a plugin, which identifies it across its versions: a DNS label (RFC 1035), so lowercase
        letters, digits and hyphens, from a letter to a letter or a digit.
      pattern: "^[a-z]([-a-z0-9]*[a-z0-9])?$"
      minLength: 1
      maxLength: 63
      examples: [scenes-composer]

    pluginSemver:
      type: string
      description: |
        A version of a plugin, as a semantic version (Semantic Versioning 2.0.0) without build metadata: three
        numbers, each below 2147483648, then an optional hyphen and prerelease identifiers.
      pattern: "^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?$"
      examples: ["1.2.0", "2.0.0-dev.1"]

    pluginChecksum:
      type: string
      description: A SHA-256 in lowercase hex.
      pattern: "^[0-9a-f]{64}$"
      examples: ["9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"]

    plugin:
      type: object
      description: A plugin of the registry, as its latest release describes it.
      required: [name, version, title, description]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/pluginName"
        version:
          $ref: "#/components/schemas/pluginSemver"
          description: The plugin's latest release. A prerelease is never one.
        title:
          type: string
          description: The plugin's title, in the language asked for, or in English when the release lacks it.
          examples: [Scenes Composer]
        description:
          type: string
          description: What the plugin does, in the language of the title.
          examples: [Compose a story scene by scene.]

    pluginPage:
      type: object
      description: A page of the registry's plugins, by name.
      required: [plugins, total]
      additionalProperties: false
      properties:
        plugins:
          type: array
          description: The plugins of the page.
          items:
            $ref: "#/components/schemas/plugin"
        total:
          type: integer
          description: |
            How many plugins the registry lists in all, so a client paging through them knows when it holds
            them all. A page past the end reports 0.
          minimum: 0
          examples: [3]

    pluginManifest:
      type: object
      description: One version of a plugin, without its modules and its translations.
      required:
        - plugin
        - version
        - schema
        - exports
        - hasMigration
        - schemaChecksum
        - uiChecksum
        - publishedAt
      additionalProperties: false
      properties:
        plugin:
          $ref: "#/components/schemas/pluginName"
        version:
          $ref: "#/components/schemas/pluginSemver"
        schema:
          type: object
          description: |
            The JSON Schema (2020-12) the content of an instance follows. Its titles and descriptions are keys
            of the version's messages.
          additionalProperties: true
          examples:
            - { "type": "object", "default": { "beats": [], "layers": [] } }
        exports:
          type: object
          description: The lists of linkable items an instance exposes, by name.
          additionalProperties: true
          examples:
            - {
                "scenes":
                  { "name": "exports.scenes", "select": "$.beats[*].scenes[*]", "id": "/id", "label": "/title" },
              }
        hasMigration:
          type: boolean
          description: Whether the version ships a migration module, which brings content from the previous version.
        schemaChecksum:
          $ref: "#/components/schemas/pluginChecksum"
          description: |
            The checksum of the stored schema. Two versions with the same one share their schema. It is not
            the hash of the JSON this response carries.
        uiChecksum:
          $ref: "#/components/schemas/pluginChecksum"
          description: The checksum of the UI module's bytes, which the module's `ETag` carries.
        publishedAt:
          type: string
          description: When the version was published.
          format: date-time
          examples: ["2026-11-19T08:15:30Z"]

    pluginMessages:
      type: object
      description: The translations of one version of a plugin in one language.
      required: [language, title, description, messages]
      additionalProperties: false
      properties:
        language:
          type: string
          description: The language of the translations, as a BCP 47 tag.
          examples: [fr]
        title:
          type: string
          description: The plugin's title.
          examples: [Compositeur de scènes]
        description:
          type: string
          description: What the plugin does.
          examples: [Composez une histoire scène par scène.]
        messages:
          type: object
          description: The translations of the plugin's interface and of its schema, by key.
          additionalProperties: true
          examples:
            - { "exports": { "scenes": "Scènes" } }

    pluginVersion:
      type: object
      description: One release of a plugin, as an upgrade steps through it.
      required: [version, hasMigration, schemaChecksum]
      additionalProperties: false
      properties:
        version:
          $ref: "#/components/schemas/pluginSemver"
        hasMigration:
          type: boolean
          description: Whether the release ships a migration module, which an upgrade runs to reach it.
        schemaChecksum:
          $ref: "#/components/schemas/pluginChecksum"
          description: The checksum of the stored schema. Two releases with the same one share their schema.

    pluginVersionPage:
      type: object
      description: A page of the releases of a plugin after a version, oldest first.
      required: [versions, total]
      additionalProperties: false
      properties:
        versions:
          type: array
          description: The releases of the page.
          items:
            $ref: "#/components/schemas/pluginVersion"
        total:
          type: integer
          description: |
            How many releases come after the version in all, so a client paging through them knows when it
            holds them all. A page past the end reports 0.
          minimum: 0
          examples: [4]

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: An access token from the authentication service, for a signed-in user.

  parameters:
    projectID:
      name: id
      in: query
      description: The project to act on.
      required: true
      schema:
        $ref: "#/components/schemas/projectID"

    parentProjectID:
      name: projectID
      in: query
      description: The project that holds what the route reads or writes.
      required: true
      schema:
        $ref: "#/components/schemas/projectID"

    instanceID:
      name: id
      in: query
      description: The instance to act on.
      required: true
      schema:
        $ref: "#/components/schemas/instanceID"

    composerLimit:
      name: limit
      in: query
      description: Maximum number of items to return, at most 500. Omitted or 0, the page holds 100.
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 500
        default: 100
        examples: [200]

    offset:
      name: offset
      in: query
      description: How many items come before the page. Omitted, the page starts at the first item.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        examples: [100]

    pluginName:
      name: plugin
      in: query
      description: The name of the plugin.
      required: true
      schema:
        $ref: "#/components/schemas/pluginName"

    pluginVersion:
      name: version
      in: query
      description: The version of the plugin to read.
      required: true
      schema:
        $ref: "#/components/schemas/pluginSemver"

    pluginAfter:
      name: after
      in: query
      description: The version the releases come after. The registry need not hold it.
      required: true
      schema:
        $ref: "#/components/schemas/pluginSemver"

    pluginListLanguage:
      name: language
      in: query
      description: |
        The language to read each title and description in, as a BCP 47 tag. Omitted, or for a plugin that is
        not translated in it, they read in English.
      required: false
      schema:
        type: string
        examples: [fr]

    pluginMessagesLanguage:
      name: language
      in: query
      description: The language to read, as a BCP 47 tag.
      required: true
      schema:
        type: string
        examples: [fr]
