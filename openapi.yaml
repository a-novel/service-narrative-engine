openapi: 3.1.0

servers:
  - url: http://127.0.0.1:{rest_port}
    variables:
      rest_port:
        default: "8080"

info:
  title: Service Narrative Engine API
  summary: The backend of the Narrative Engine.
  description: |
    The public REST API of the Narrative Engine, a workstation for writing narratives.

    ## Scenes Composer

    A project holds one narrative. Its Scenes Composer is a grid: scenes are the columns, in narrative
    order, and layers are the rows. A cell holds what one layer says about one scene. Every project keeps
    at least one manuscript layer, whose cells carry the text the manuscript exports. Notes layers hold
    free text the author keeps beside it.

    Every route but the health ones acts for the signed-in user, who owns the projects it reads and
    writes. A project of another user answers as if it did not exist.

    Each write replaces what it targets, and the last write wins. Every record keeps the time it was
    last written.

  version: v0.0.0
  license:
    name: AGPL-3.0
    url: "https://raw.githubusercontent.com/a-novel/service-narrative-engine/refs/heads/master/LICENSE"

security:
  - BearerAuth: []

tags:
  - name: health
    description: Liveness and dependency checks.
  - name: project
    description: Projects and the layout of their Scenes Composer.
  - name: scene
    description: The columns of a Scenes Composer, in narrative order.
  - name: layer
    description: The rows of a Scenes Composer.
  - name: cell
    description: What one layer says about one scene.

paths:
  /v1/ping:
    get:
      operationId: ping
      summary: Ping the server.
      description: |
        Checks whether the server is up and running. It always returns the same response.

        Dependency health lives on the `/v1/healthcheck` endpoint.
      tags: [health]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/pong"
        default:
          $ref: "#/components/responses/internalError"

  /v1/healthcheck:
    get:
      operationId: healthcheck
      summary: Health diagnosis of the server.
      description: |
        Probes every server dependency and reports whether each one answered. Returns HTTP 200
        when every dependency is up, and HTTP 503 with the same report otherwise. `/v1/ping`
        checks the process alone.
      tags: [health]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/health"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/healthUnavailable"
        default:
          $ref: "#/components/responses/internalError"

  /v1/projects:
    post:
      operationId: projectCreate
      summary: Create a project.
      description: |
        Creates a project with its required layers, one of each required kind, in one step. Its scenes come
        next, from sceneCreate or scenesCreate.
      tags: [project]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/projectCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/projectComposer"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    get:
      operationId: projectList
      summary: List projects.
      description: |
        Returns a page of the caller's projects, newest first, with how many the caller holds in all. To read
        the next page, raise `offset` by the page size.
      tags: [project]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/projectList"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/project:
    get:
      operationId: projectGet
      summary: Get a project.
      description: |
        Returns a project of the caller. Its scenes, layers and cells come page by page from `GET /v1/scenes`,
        `GET /v1/layers` and `GET /v1/cells`.
      tags: [project]
      parameters:
        - $ref: "#/components/parameters/projectID"
      responses:
        "200":
          $ref: "#/components/responses/project"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    put:
      operationId: projectUpdate
      summary: Update a project.
      description: |
        Replaces the title, premise and language of a project.
      tags: [project]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/projectUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/project"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    delete:
      operationId: projectDelete
      summary: Delete a project.
      description: |
        Deletes a project with its scenes, layers and cells, and returns the project as it was.
      tags: [project]
      parameters:
        - $ref: "#/components/parameters/projectID"
      responses:
        "200":
          $ref: "#/components/responses/project"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/scene:
    post:
      operationId: sceneCreate
      summary: Create a scene.
      description: |
        Adds one scene to a project at `position`, and moves the scenes from there on down one place. A
        position past the last scene appends it. A project holds at most 500 scenes. scenesCreate adds several
        at once.
      tags: [scene]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/sceneCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/scene"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/projectFull"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    put:
      operationId: sceneUpdate
      summary: Update a scene.
      description: |
        Replaces the title, color, description and prompt of a scene.
      tags: [scene]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/sceneUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/scene"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    delete:
      operationId: sceneDelete
      summary: Delete a scene.
      description: |
        Deletes one scene with its cells, and returns it as it was. The scenes after it move up one place.
        scenesDelete deletes several at once.
      tags: [scene]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
        - $ref: "#/components/parameters/sceneID"
      responses:
        "200":
          $ref: "#/components/responses/scene"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/scene/move:
    post:
      operationId: sceneMove
      summary: Move a scene.
      description: |
        Moves a scene to `position`, and returns it there. The scenes between its old and new position shift
        by one. A position past the last scene moves it last.
      tags: [scene]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/sceneMoveRequest"
      responses:
        "200":
          $ref: "#/components/responses/scene"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/scenes:
    get:
      operationId: sceneList
      summary: List the scenes of a project.
      description: |
        Returns a page of a project's scenes, in narrative order, with how many the project holds in all. To read the next
        page, raise `offset` by the page size.
      tags: [scene]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
        - $ref: "#/components/parameters/composerLimit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/scenePage"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    post:
      operationId: scenesCreate
      summary: Create scenes.
      description: |
        Adds up to 100 scenes to a project at `position`, in order, and moves the scenes from there on down.
        A position past the last scene appends them. A project holds at most 500 scenes. The scenes are all
        added, or none are.
      tags: [scene]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/scenesCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/scenes"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/projectFull"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    put:
      operationId: scenesUpdate
      summary: Update scenes.
      description: |
        Replaces the title, color, description and prompt of up to 100 scenes, and returns them in the order
        of the request. The scenes are all updated, or none are: an id the project does not hold answers 404.
      tags: [scene]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/scenesUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/scenes"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    delete:
      operationId: scenesDelete
      summary: Delete scenes.
      description: |
        Deletes up to 100 scenes with their cells, and returns them as they were. The scenes after them move
        up to close the gaps. The scenes are all deleted, or none are: an id the project does not hold
        answers 404.
      tags: [scene]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
        - $ref: "#/components/parameters/sceneIDs"
      responses:
        "200":
          $ref: "#/components/responses/scenes"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/layer:
    post:
      operationId: layerCreate
      summary: Create a layer.
      description: |
        Adds one layer of any kind to a project at `position`, and moves the layers from there on down one
        place. A position past the last layer appends it. A project holds at most 1000 layers. layersCreate adds
        several at once.
      tags: [layer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/layerCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/layer"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/projectFull"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    put:
      operationId: layerUpdate
      summary: Update a layer.
      description: |
        Replaces the name and description of a layer.
      tags: [layer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/layerUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/layer"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    delete:
      operationId: layerDelete
      summary: Delete a layer.
      description: |
        Deletes one layer with its cells, and returns it as it was. The layers after it move up one place. A
        project keeps at least one layer of each required kind, such as the manuscript. layersDelete deletes
        several at once.
      tags: [layer]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
        - $ref: "#/components/parameters/layerID"
      responses:
        "200":
          $ref: "#/components/responses/layer"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/requiredLayer"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/layer/move:
    post:
      operationId: layerMove
      summary: Move a layer.
      description: |
        Moves a layer to `position`, and returns it there. The layers between its old and new position shift
        by one. A position past the last layer moves it last.
      tags: [layer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/layerMoveRequest"
      responses:
        "200":
          $ref: "#/components/responses/layer"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/layers:
    get:
      operationId: layerList
      summary: List the layers of a project.
      description: |
        Returns a page of a project's layers, in order, with how many the project holds in all. To read the next
        page, raise `offset` by the page size.
      tags: [layer]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
        - $ref: "#/components/parameters/composerLimit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/layerPage"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    post:
      operationId: layersCreate
      summary: Create layers.
      description: |
        Adds up to 100 layers of any kind to a project at `position`, in order, and moves the layers from
        there on down. A position past the last layer appends them. A project holds at most 1000 layers. The
        layers are all added, or none are.
      tags: [layer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/layersCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/layers"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/projectFull"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    put:
      operationId: layersUpdate
      summary: Update layers.
      description: |
        Replaces the name and description of up to 100 layers, and returns them in the order of the request.
        The layers are all updated, or none are: an id the project does not hold answers 404.
      tags: [layer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/layersUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/layers"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    delete:
      operationId: layersDelete
      summary: Delete layers.
      description: |
        Deletes up to 100 layers with their cells, and returns them as they were. The layers after them move
        up to close the gaps. A project keeps at least one layer of each required kind, such as the
        manuscript. The layers are all deleted, or none are: an id the project does not hold answers 404.
      tags: [layer]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
        - $ref: "#/components/parameters/layerIDs"
      responses:
        "200":
          $ref: "#/components/responses/layers"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/requiredLayer"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/cell:
    put:
      operationId: cellWrite
      summary: Write a cell.
      description: |
        Writes the content of the cell where a scene and a layer of the project cross, and returns the cell's
        scene, layer and write time without the content the client already holds. The content follows the
        content schema of the layer's kind and weighs at most 2 MiB, and the body at most 4 MiB. The first
        write creates the cell. cellsWrite writes several at once.
      tags: [cell]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cellWriteRequest"
      responses:
        "200":
          $ref: "#/components/responses/writtenCell"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/cells:
    get:
      operationId: cellList
      summary: List the cells of a project.
      description: |
        Returns a page of the cells written so far in a project, by the position of their scene, then of their
        layer, with how many the project holds in all. A cell nobody wrote yet is absent. To read the next
        page, raise `offset` by the page size.
      tags: [cell]
      parameters:
        - $ref: "#/components/parameters/parentProjectID"
        - $ref: "#/components/parameters/composerLimit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          $ref: "#/components/responses/cellPage"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    put:
      operationId: cellsWrite
      summary: Write cells.
      description: |
        Writes up to 100 cells where scenes and layers of the project cross, and returns each written cell's
        scene, layer and write time, in the order of the request, without the content the client already
        holds. Each content follows the content schema of its layer's kind and weighs at most 2 MiB, and the
        whole body at most 50 MiB. The first write of a cell creates it. The cells are all written, or none
        are.
      tags: [cell]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cellsWriteRequest"
      responses:
        "200":
          $ref: "#/components/responses/writtenCells"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

components:
  responses:
    pong:
      description: Server is alive.
      content:
        text/plain:
          schema:
            type: string
            examples: [pong]

    health:
      description: All server dependencies are healthy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/healthReport"
          examples:
            healthy:
              value: { "client:postgres": { "status": "up" }, "api:jsonKeys": { "status": "up" } }

    healthUnavailable:
      description: |
        At least one dependency probe failed. During a planned downtime, the body is a problem
        tagged `downtime` instead.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/plannedDowntimeProblem"
        application/json:
          schema:
            $ref: "#/components/schemas/healthReport"
          examples:
            degraded:
              value: { "client:postgres": { "status": "up" }, "api:jsonKeys": { "status": "down" } }

    plannedDowntime:
      description: |
        The service is in a planned downtime and refuses work until operators end it. The platform
        reads the announced window from the downtime document infra publishes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/plannedDowntimeProblem"

    project:
      description: A project.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/project"

    projectList:
      description: A page of projects, newest first, with their total.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/projectPage"

    projectComposer:
      description: A new project with its required layers.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/projectComposer"

    scene:
      description: A scene.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/scene"

    scenePage:
      description: A page of a project's scenes, in narrative order, with their total.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/scenePage"

    layer:
      description: A layer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/layer"

    layerPage:
      description: A page of a project's layers, in order, with their total.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/layerPage"

    scenes:
      description: Scenes, in narrative order.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/scene"

    layers:
      description: Layers, in order.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/layer"

    writtenCell:
      description: The written cell, without its content.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/writtenCell"

    writtenCells:
      description: The written cells, in the order of the request, without their content.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/writtenCell"

    cellPage:
      description: A page of a project's cells, by the position of their scene, then of their layer, with their total.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/cellPage"

    badRequest:
      description: |
        The request could not be parsed, or failed validation. A field that breaks its rule answers a
        problem naming each invalid field and the rule it broke. Malformed JSON, a body over its limit and
        content that breaks its schema answer the status text alone.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/invalidRequest"
        text/plain:
          schema:
            type: string
            examples: [Bad Request]

    invalidToken:
      description: |
        The bearer token is missing or invalid, for instance expired. Refresh the session or sign in again.

    forbidden:
      description: |
        The session lacks the permission this route requires, such as an anonymous session, which owns no
        project.

    notFound:
      description: |
        The caller owns no such project, or the project holds no such scene or layer.

    projectFull:
      description: |
        The project already holds as many scenes or layers as it may.

    requiredLayer:
      description: |
        A project keeps at least one layer of each required kind, such as the manuscript.

    tooManyRequests:
      description: |
        The caller sent too many requests to this route. Retry once `Retry-After` has elapsed.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer

    internalError:
      description: Something unexpected happened.

  schemas:
    invalidRequest:
      type: object
      description: |
        An RFC 9457 problem details body whose tags name the request fields that failed validation. Field
        paths and rule codes come from the API definition, never from the submitted values.
      required: [type, title, status, tags]
      additionalProperties: false
      properties:
        type:
          type: string
          description: The problem type; about:blank makes the title the HTTP status text.
          const: about:blank
        title:
          type: string
          description: The HTTP status text.
          examples: [Bad Request]
        status:
          type: integer
          description: The HTTP status code.
          const: 400
        tags:
          type: object
          description: Public details about the failure. Clients ignore tags they do not know.
          required: [invalidFields]
          additionalProperties: true
          properties:
            invalidFields:
              type: object
              description: |
                Maps the path of each invalid field, in lower camel case with `.` for nesting and `[i]` for a
                list item, to the validation rule it broke. Standard rules carry their usual name (required,
                max); service rules name a domain check (notblank).
              additionalProperties:
                type: string
              examples:
                - { "title": "notblank" }

    projectID:
      type: string
      description: The unique identifier of a project.
      format: uuid
      examples: ["01920000-0000-7000-8000-000000000001"]

    sceneID:
      type: string
      description: The unique identifier of a scene.
      format: uuid
      examples: ["01920000-0000-7000-8000-000000000011"]

    layerID:
      type: string
      description: The unique identifier of a layer.
      format: uuid
      examples: ["01920000-0000-7000-8000-000000000021"]

    language:
      type: string
      description: The language the project is written in, as a BCP 47 tag.
      enum: [en, fr]
      examples: [fr]

    project:
      type: object
      description: One narrative, written in one language, that its owner composes scene by scene.
      required: [id, title, premise, language, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/projectID"
        title:
          type: string
          description: The title of the project.
          examples: ["Les Heures claires"]
        premise:
          type: string
          description: What the narrative is about, in a few sentences. Empty until the author writes one.
          examples: ["Marie attend un homme qui ne viendra pas."]
        language:
          $ref: "#/components/schemas/language"
        createdAt:
          type: string
          description: When the project was created.
          format: date-time
          examples: ["2021-01-01T00:00:00Z"]
        updatedAt:
          type: string
          description: When the project was last written.
          format: date-time
          examples: ["2021-01-02T00:00:00Z"]

    projectComposer:
      type: object
      description: A new project with the layers it starts with, in order.
      required: [id, title, premise, language, createdAt, updatedAt, layers]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/projectID"
        title:
          $ref: "#/components/schemas/project/properties/title"
        premise:
          $ref: "#/components/schemas/project/properties/premise"
        language:
          $ref: "#/components/schemas/language"
        createdAt:
          $ref: "#/components/schemas/project/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/project/properties/updatedAt"
        layers:
          type: array
          description: The required layers of the project, one of each kind, in order.
          items:
            $ref: "#/components/schemas/layer"

    projectPage:
      type: object
      description: A page of the caller's projects, newest first.
      required: [projects, total]
      additionalProperties: false
      properties:
        projects:
          type: array
          description: The projects of the page.
          items:
            $ref: "#/components/schemas/project"
        total:
          type: integer
          description: |
            How many projects the caller holds in all, so a client paging through them knows when it holds
            them all. A page past the end reports 0.
          minimum: 0
          examples: [42]

    scene:
      type: object
      description: A column of the Scenes Composer.
      required: [id, projectID, position, title, color, description, prompt, updatedAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/sceneID"
        projectID:
          $ref: "#/components/schemas/projectID"
        position:
          type: integer
          description: The place of the scene in narrative order, from 0, with no gap.
          minimum: 0
          examples: [0]
        title:
          type: string
          description: The title of the scene.
          examples: ["Ouverture"]
        color:
          type: string
          description: The scene's color in the composer, as a lowercase `#rrggbb` hex code.
          pattern: "^#[0-9a-f]{6}$"
          examples: ["#e0457b"]
        description:
          type: string
          description: What the scene is for, written for the author. May be empty.
          examples: ["Marie attend sur le quai."]
        prompt:
          type: string
          description: Extra instructions for the model when it writes about the scene. May be empty.
          examples: ["Garder le suspense jusqu'au dernier dialogue."]
        updatedAt:
          type: string
          description: When the scene was last written.
          format: date-time
          examples: ["2021-01-02T00:00:00Z"]

    layer:
      type: object
      description: A row of the Scenes Composer. Its kind names the content schema its cells follow.
      required: [id, projectID, position, kind, name, description, updatedAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/layerID"
        projectID:
          $ref: "#/components/schemas/projectID"
        position:
          type: integer
          description: The place of the layer among the rows, from 0, with no gap.
          minimum: 0
          examples: [0]
        kind:
          type: string
          description: |
            The content schema the cells of the layer follow: `manuscript` for a layer of manuscript text,
            `notes` for free text. Later releases add kinds, so a client skips a layer of a kind it does not
            know.
          examples: [manuscript, notes]
        name:
          type: string
          description: The name of the layer.
          examples: ["Characters"]
        description:
          type: string
          description: What the layer records. May be empty.
          examples: ["Who appears in the scene."]
        updatedAt:
          type: string
          description: When the layer was last written.
          format: date-time
          examples: ["2021-01-02T00:00:00Z"]

    cell:
      type: object
      description: What one layer says about one scene.
      required: [projectID, sceneID, layerID, content, updatedAt]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        sceneID:
          $ref: "#/components/schemas/sceneID"
        layerID:
          $ref: "#/components/schemas/layerID"
        content:
          type: object
          description: |
            A JSON document that follows the content schema of the layer's kind: cellContent for the kinds this
            release knows. A later release may add kinds, so a client keeps the content of an unknown kind as it
            is.
          examples:
            - { "blocks": [{ "kind": "narration", "text": "La pluie battait les vitres." }] }
        updatedAt:
          type: string
          description: When the cell was last written.
          format: date-time
          examples: ["2021-01-02T00:00:00Z"]

    writtenCell:
      type: object
      description: A cell a write just stored, without its content.
      required: [sceneID, layerID, updatedAt]
      additionalProperties: false
      properties:
        sceneID:
          $ref: "#/components/schemas/sceneID"
        layerID:
          $ref: "#/components/schemas/layerID"
        updatedAt:
          $ref: "#/components/schemas/cell/properties/updatedAt"

    scenePage:
      type: object
      description: A page of a project's scenes, in narrative order.
      required: [scenes, total]
      additionalProperties: false
      properties:
        scenes:
          type: array
          description: The scenes of the page.
          items:
            $ref: "#/components/schemas/scene"
        total:
          type: integer
          description: |
            How many scenes the project holds in all, so a client paging through them knows when it holds them
            all. A page past the end reports 0.
          minimum: 0
          examples: [120]

    layerPage:
      type: object
      description: A page of a project's layers, in order.
      required: [layers, total]
      additionalProperties: false
      properties:
        layers:
          type: array
          description: The layers of the page.
          items:
            $ref: "#/components/schemas/layer"
        total:
          type: integer
          description: |
            How many layers the project holds in all, so a client paging through them knows when it holds them
            all. A page past the end reports 0.
          minimum: 0
          examples: [12]

    cellPage:
      type: object
      description: A page of a project's cells, by the position of their scene, then of their layer.
      required: [cells, total]
      additionalProperties: false
      properties:
        cells:
          type: array
          description: The cells of the page.
          items:
            $ref: "#/components/schemas/cell"
        total:
          type: integer
          description: |
            How many cells the project holds in all, so a client paging through them knows when it holds them
            all. A page past the end reports 0.
          minimum: 0
          examples: [1200]

    cellContent:
      description: |
        A JSON document that follows the content schema of its layer's kind. The server validates it with
        the same schema files this definition references.
      examples:
        - { "blocks": [{ "kind": "narration", "text": "La pluie battait les vitres." }] }
        - { "text": "Marie, Paul." }
      anyOf:
        - $ref: "./internal/models/schemas/content.manuscript.schema.json"
        - $ref: "./internal/models/schemas/content.notes.schema.json"

    projectCreateRequest:
      type: object
      description: The project to create.
      required: [title, language]
      additionalProperties: false
      examples:
        - { "title": "Les Heures claires", "language": "fr" }
      properties:
        title:
          type: string
          description: The title of the project. Not blank.
          maxLength: 200
          examples: ["Les Heures claires"]
        premise:
          type: string
          description: What the narrative is about.
          maxLength: 20000
          examples: ["Marie attend un homme qui ne viendra pas."]
        language:
          $ref: "#/components/schemas/language"

    sceneCreateItem:
      type: object
      description: A scene to add.
      required: [title, color]
      additionalProperties: false
      properties:
        title:
          type: string
          description: The title of the scene. Not blank.
          maxLength: 200
          examples: ["Ouverture"]
        color:
          type: string
          description: The scene's color in the composer, as a `#rrggbb` hex code in either case. It is stored in lowercase.
          pattern: "^#[0-9A-Fa-f]{6}$"
          examples: ["#E0457B"]
        description:
          type: string
          description: What the scene is for, written for the author.
          maxLength: 20000
          examples: ["Marie attend sur le quai."]
        prompt:
          type: string
          description: Extra instructions for the model when it writes about the scene.
          maxLength: 20000
          examples: ["Garder le suspense jusqu'au dernier dialogue."]

    projectUpdateRequest:
      type: object
      description: The new fields of a project.
      required: [id, title, language]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/projectID"
        title:
          $ref: "#/components/schemas/projectCreateRequest/properties/title"
        premise:
          $ref: "#/components/schemas/projectCreateRequest/properties/premise"
        language:
          $ref: "#/components/schemas/language"

    scenesCreateRequest:
      type: object
      description: The scenes to add, and where.
      required: [projectID, scenes]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        position:
          type: integer
          description: The place of the first new scene in narrative order, from 0, and the others follow it. A position past the last scene appends them.
          minimum: 0
          default: 0
          examples: [2]
        scenes:
          type: array
          description: The scenes to add, in narrative order.
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/sceneCreateItem"

    sceneCreateRequest:
      type: object
      description: The scene to add, and where.
      required: [projectID, title, color]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        position:
          type: integer
          description: The scene's place in narrative order, from 0. A position past the last scene appends it.
          minimum: 0
          default: 0
          examples: [2]
        title:
          $ref: "#/components/schemas/sceneCreateItem/properties/title"
        color:
          $ref: "#/components/schemas/sceneCreateItem/properties/color"
        description:
          $ref: "#/components/schemas/sceneCreateItem/properties/description"
        prompt:
          $ref: "#/components/schemas/sceneCreateItem/properties/prompt"

    sceneUpdateRequest:
      type: object
      description: The new fields of a scene.
      required: [projectID, id, title, color]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        id:
          $ref: "#/components/schemas/sceneID"
        title:
          $ref: "#/components/schemas/sceneCreateItem/properties/title"
        color:
          $ref: "#/components/schemas/sceneCreateItem/properties/color"
        description:
          $ref: "#/components/schemas/sceneCreateItem/properties/description"
        prompt:
          $ref: "#/components/schemas/sceneCreateItem/properties/prompt"

    sceneUpdateItem:
      type: object
      description: The new fields of one scene.
      required: [id, title, color]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/sceneID"
        title:
          $ref: "#/components/schemas/sceneCreateItem/properties/title"
        color:
          $ref: "#/components/schemas/sceneCreateItem/properties/color"
        description:
          $ref: "#/components/schemas/sceneCreateItem/properties/description"
        prompt:
          $ref: "#/components/schemas/sceneCreateItem/properties/prompt"

    scenesUpdateRequest:
      type: object
      description: The scenes to update, each once.
      required: [projectID, scenes]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        scenes:
          type: array
          description: The scenes to update, each once, at most 100.
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/sceneUpdateItem"

    sceneMoveRequest:
      type: object
      description: The scene to move, and where.
      required: [projectID, id, position]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        id:
          $ref: "#/components/schemas/sceneID"
        position:
          type: integer
          description: The scene's place in narrative order after the move, from 0. A position past the last scene moves it last.
          minimum: 0
          examples: [2]

    layerCreateItem:
      type: object
      description: A layer to add.
      required: [kind, name]
      additionalProperties: false
      properties:
        kind:
          type: string
          description: The content schema the cells of the layer follow, such as `manuscript` or `notes`. A kind with no content schema answers 400.
          examples: [notes]
        name:
          type: string
          description: The name of the layer. Not blank.
          maxLength: 100
          examples: ["Characters"]
        description:
          type: string
          description: What the layer records.
          maxLength: 20000
          examples: ["Who appears in the scene."]

    layersCreateRequest:
      type: object
      description: The layers to add, and where.
      required: [projectID, layers]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        position:
          type: integer
          description: The place of the first new layer among the project's rows, from 0, and the others follow it. A position past the last layer appends them.
          minimum: 0
          default: 0
          examples: [2]
        layers:
          type: array
          description: The layers to add, in order.
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/layerCreateItem"

    layerCreateRequest:
      type: object
      description: The layer to add, and where.
      required: [projectID, kind, name]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        position:
          type: integer
          description: The layer's place among the project's rows, from 0. A position past the last layer appends it.
          minimum: 0
          default: 0
          examples: [2]
        kind:
          $ref: "#/components/schemas/layerCreateItem/properties/kind"
        name:
          $ref: "#/components/schemas/layerCreateItem/properties/name"
        description:
          $ref: "#/components/schemas/layerCreateItem/properties/description"

    layerUpdateRequest:
      type: object
      description: The new fields of a layer.
      required: [projectID, id, name]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        id:
          $ref: "#/components/schemas/layerID"
        name:
          $ref: "#/components/schemas/layerCreateItem/properties/name"
        description:
          $ref: "#/components/schemas/layerCreateItem/properties/description"

    layerUpdateItem:
      type: object
      description: The new fields of one layer.
      required: [id, name]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/layerID"
        name:
          $ref: "#/components/schemas/layerCreateItem/properties/name"
        description:
          $ref: "#/components/schemas/layerCreateItem/properties/description"

    layersUpdateRequest:
      type: object
      description: The layers to update, each once.
      required: [projectID, layers]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        layers:
          type: array
          description: The layers to update, each once, at most 100.
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/layerUpdateItem"

    layerMoveRequest:
      type: object
      description: The layer to move, and where.
      required: [projectID, id, position]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        id:
          $ref: "#/components/schemas/layerID"
        position:
          type: integer
          description: The layer's place among the project's rows after the move, from 0. A position past the last layer moves it last.
          minimum: 0
          examples: [2]

    cellWriteItem:
      type: object
      description: The content of one cell.
      required: [sceneID, layerID, content]
      additionalProperties: false
      properties:
        sceneID:
          $ref: "#/components/schemas/sceneID"
        layerID:
          $ref: "#/components/schemas/layerID"
        content:
          $ref: "#/components/schemas/cellContent"

    cellsWriteRequest:
      type: object
      description: The cells to write. A scene and a layer meet in at most one of them.
      required: [projectID, cells]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        cells:
          type: array
          description: The cells to write, at most 100.
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/cellWriteItem"

    cellWriteRequest:
      type: object
      description: The content of one cell.
      required: [projectID, sceneID, layerID, content]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        sceneID:
          $ref: "#/components/schemas/sceneID"
        layerID:
          $ref: "#/components/schemas/layerID"
        content:
          $ref: "#/components/schemas/cellContent"

    plannedDowntimeProblem:
      type: object
      description: |
        An RFC 9457 problem details body answering a request refused during a planned downtime. Clients
        ignore extension members they do not know.
      required: [type, title, status, tags]
      additionalProperties: true
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          const: 503
        tags:
          type: object
          required: [downtime]
          properties:
            downtime:
              type: boolean
              const: true
    healthReport:
      type: object
      description: The status of each dependency. Every dependency must be up for HTTP 200.
      required: ["client:postgres", "api:jsonKeys"]
      additionalProperties:
        $ref: "#/components/schemas/healthStatus"
      properties:
        "client:postgres":
          $ref: "#/components/schemas/healthStatus"
        "api:jsonKeys":
          $ref: "#/components/schemas/healthStatus"
    healthStatus:
      type: object
      description: |
        The status of one dependency, as the server observed it. The endpoint is unauthenticated,
        so the entry carries the state alone. Diagnostics stay on server-side traces.
      required: [status]
      additionalProperties: false
      examples:
        - { "status": "up" }
        - { "status": "down" }
      properties:
        status:
          type: string
          description: Whether the server reached the dependency.
          enum: [up, down]

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: An access token from the authentication service, for a signed-in user.

  parameters:
    projectID:
      name: id
      in: query
      description: The project to act on.
      required: true
      schema:
        $ref: "#/components/schemas/projectID"

    sceneID:
      name: id
      in: query
      description: The scene to act on.
      required: true
      schema:
        $ref: "#/components/schemas/sceneID"

    layerID:
      name: id
      in: query
      description: The layer to act on.
      required: true
      schema:
        $ref: "#/components/schemas/layerID"

    sceneIDs:
      name: id
      in: query
      description: The scenes to act on, one parameter each.
      required: true
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 100
        uniqueItems: true
        items:
          $ref: "#/components/schemas/sceneID"

    layerIDs:
      name: id
      in: query
      description: The layers to act on, one parameter each.
      required: true
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 100
        uniqueItems: true
        items:
          $ref: "#/components/schemas/layerID"

    limit:
      name: limit
      in: query
      description: Maximum number of projects to return, at most 100. Omitted or 0, the page holds 20.
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 20
        examples: [10]

    parentProjectID:
      name: projectID
      in: query
      description: The project that holds the scenes, layers or cells.
      required: true
      schema:
        $ref: "#/components/schemas/projectID"

    composerLimit:
      name: limit
      in: query
      description: Maximum number of items to return, at most 500. Omitted or 0, the page holds 100.
      required: false
      schema:
        type: integer
        minimum: 0
        maximum: 500
        default: 100
        examples: [200]

    offset:
      name: offset
      in: query
      description: How many items come before the page. Omitted, the page starts at the first item.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
        examples: [100]
