openapi: 3.1.0

servers:
  - url: http://127.0.0.1:{rest_port}
    variables:
      rest_port:
        default: "8080"

info:
  title: Service Narrative Engine API
  summary: Public REST API for the narrative-engine service.
  description: |
    The public health surface for the narrative-engine service.
  version: v0.0.0
  license:
    name: AGPL-3.0
    url: "https://raw.githubusercontent.com/a-novel/service-narrative-engine/refs/heads/master/LICENSE"

paths:
  /ping:
    get:
      operationId: ping
      summary: Ping the server.
      description: |
        A simple endpoint to check if the server is up and running. It always returns the same response.

        It does not check the server dependencies; use the `/healthcheck` endpoint to diagnose the server's
        actual health.
      tags: [health]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/pong"
        "418":
          $ref: "#/components/responses/teapot"
        default:
          $ref: "#/components/responses/internalError"

  /healthcheck:
    get:
      operationId: healthcheck
      summary: Health diagnosis of the server.
      description: |
        Returns a dependency report cached for about 30 seconds. It checks PostgreSQL and
        JSON-keys reachability, and includes the service-jobs queue backlog when available.
      tags: [health]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/health"
        "418":
          $ref: "#/components/responses/teapot"
        default:
          $ref: "#/components/responses/internalError"

components:
  responses:
    pong:
      description: A plain-text pong response.
      content:
        text/plain:
          schema:
            type: string
            examples: [pong]

    health:
      description: Cached health and queue summary for every server dependency.
      content:
        application/json:
          schema:
            type: object
            required: ["client:postgres", "client:json-keys", "client:jobs"]
            additionalProperties: false
            properties:
              "client:postgres":
                $ref: "#/components/schemas/healthStatus"
              "client:json-keys":
                $ref: "#/components/schemas/healthStatus"
              "client:jobs":
                $ref: "#/components/schemas/healthJobsStatus"
          examples:
            healthy:
              value:
                "client:postgres": { "status": "up" }
                "client:json-keys": { "status": "up" }
                "client:jobs":
                  status: up
                  queue: { "pending": 3, "oldestPendingAge": "1m30s" }
            degraded-jobs:
              value:
                "client:postgres": { "status": "up" }
                "client:json-keys": { "status": "up" }
                "client:jobs": { "status": "down" }

    internalError:
      description: Something unexpected happened.

    teapot:
      description: I'm a teapot!

  schemas:
    healthStatus:
      type: object
      description: |
        Status of a single dependency entry, as observed by the server. It carries the
        state alone, so an unauthenticated caller cannot infer infrastructure details
        from a degraded dependency; richer diagnostics are recorded on server-side traces.
      required: [status]
      additionalProperties: false
      examples:
        - { "status": "up" }
        - { "status": "down" }
      properties:
        status:
          type: string
          description: Exposes whether the server managed to connect to the dependency.
          enum: [up, down]

    healthJobsStatus:
      type: object
      description: |
        Health of the service-jobs dependency. Queue is present only when the
        service can measure its backlog.
      required: [status]
      additionalProperties: false
      examples:
        - { "status": "up", "queue": { "pending": 0 } }
        - { "status": "down" }
      properties:
        status:
          type: string
          description: Exposes whether the service-jobs queue could be measured.
          enum: [up, down]
        queue:
          $ref: "#/components/schemas/healthQueue"

    healthQueue:
      type: object
      description: Backlog measured by service-jobs for due and unclaimed jobs.
      required: [pending]
      additionalProperties: false
      properties:
        pending:
          type: integer
          format: int64
          minimum: 0
          description: Number of due jobs still waiting for a worker.
          examples: [3]
        oldestPendingAge:
          type: string
          description: |
            Go duration of the oldest pending job. Omitted when the queue is empty.
          examples: ["1m30s"]
