openapi: 3.1.0

servers:
  - url: http://127.0.0.1:{rest_port}
    variables:
      rest_port:
        default: "8080"

info:
  title: Service Narrative Engine API
  summary: The backend of the Narrative Engine.
  description: |
    The public REST API of the Narrative Engine, a workstation for writing narratives.

    ## Scenes Composer

    A project holds one narrative. Its Scenes Composer is a grid: scenes are the columns, in narrative
    order, and layers are the rows. A cell holds what one layer says about one scene. Every project has
    one manuscript layer, whose cells carry the text the manuscript exports. Notes layers hold free
    text the author keeps beside it.

    Every route but the health ones acts for the signed-in user, who owns the projects it reads and
    writes. A project of another user answers as if it did not exist.

    ## Revisions

    Each project, scene, layer and cell carries a revision, which every write raises. A write names the
    revision it read, and answers `409` once the stored data moved past it. The client then reads the
    data again before it retries. Moving a scene or a layer changes positions only, so it leaves every
    revision as it was.

  version: v0.0.0
  license:
    name: AGPL-3.0
    url: "https://raw.githubusercontent.com/a-novel/service-narrative-engine/refs/heads/master/LICENSE"

security:
  - BearerAuth: []

tags:
  - name: health
    description: Liveness and dependency checks.
  - name: project
    description: Projects and their whole Scenes Composer.
  - name: scene
    description: The columns of a Scenes Composer, in narrative order.
  - name: layer
    description: The rows of a Scenes Composer.
  - name: cell
    description: What one layer says about one scene.

paths:
  /v1/ping:
    get:
      operationId: ping
      summary: Ping the server.
      description: |
        Checks whether the server is up and running. It always returns the same response.

        Dependency health lives on the `/v1/healthcheck` endpoint.
      tags: [health]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/pong"
        default:
          $ref: "#/components/responses/internalError"

  /v1/healthcheck:
    get:
      operationId: healthcheck
      summary: Health diagnosis of the server.
      description: |
        Probes every server dependency and reports whether each one answered. Returns HTTP 200
        when every dependency is up, and HTTP 503 with the same report otherwise. `/v1/ping`
        checks the process alone.
      tags: [health]
      security: []
      responses:
        "200":
          $ref: "#/components/responses/health"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/healthUnavailable"
        default:
          $ref: "#/components/responses/internalError"

  /v1/projects:
    post:
      operationId: projectCreate
      summary: Create a project.
      description: |
        Creates a project with its manuscript layer and the scenes it starts with, in order, in one step.
        A project starts with at most 100 scenes.
      tags: [project]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/projectCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/projectComposer"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    get:
      operationId: projectList
      summary: List projects.
      description: |
        Returns a page of the caller's projects, newest first. To read the next page, pass the ID of the last
        project received as `after`.
      tags: [project]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/after"
      responses:
        "200":
          $ref: "#/components/responses/projectList"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/project:
    get:
      operationId: projectGet
      summary: Get a project with its Scenes Composer.
      description: |
        Returns a project with every scene and layer, each list in its order, and every cell written so far.
        A cell nobody wrote yet is absent.
      tags: [project]
      parameters:
        - $ref: "#/components/parameters/projectID"
      responses:
        "200":
          $ref: "#/components/responses/projectComposer"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    put:
      operationId: projectUpdate
      summary: Update a project.
      description: |
        Replaces the title, premise and language of a project.
      tags: [project]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/projectUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/project"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/revisionConflict"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    delete:
      operationId: projectDelete
      summary: Delete a project.
      description: |
        Deletes a project with its scenes, layers and cells, and returns the project as it was.
      tags: [project]
      parameters:
        - $ref: "#/components/parameters/projectID"
        - $ref: "#/components/parameters/revision"
      responses:
        "200":
          $ref: "#/components/responses/project"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/revisionConflict"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/scenes:
    post:
      operationId: sceneCreate
      summary: Create a scene.
      description: |
        Adds a scene to a project, right after the scene `after` names, or first without it. A project holds
        at most 500 scenes.
      tags: [scene]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/sceneCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/scene"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/projectFull"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/scene:
    put:
      operationId: sceneUpdate
      summary: Update a scene.
      description: |
        Replaces the title and synopsis of a scene.
      tags: [scene]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/sceneUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/scene"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/revisionConflict"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    delete:
      operationId: sceneDelete
      summary: Delete a scene.
      description: |
        Deletes a scene with its cells, and returns the scene as it was. The scenes after it move up one
        place.
      tags: [scene]
      parameters:
        - $ref: "#/components/parameters/sceneID"
        - $ref: "#/components/parameters/revision"
      responses:
        "200":
          $ref: "#/components/responses/scene"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/revisionConflict"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/scene/move:
    post:
      operationId: sceneMove
      summary: Move a scene.
      description: |
        Moves a scene right after the scene `after` names, or first without it. Returns every scene of the
        project in their new order.
      tags: [scene]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/sceneMoveRequest"
      responses:
        "200":
          $ref: "#/components/responses/sceneList"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/layers:
    post:
      operationId: layerCreate
      summary: Create a notes layer.
      description: |
        Adds a notes layer to a project, right after the layer `after` names, or first without it. A project
        holds at most 20 layers.
      tags: [layer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/layerCreateRequest"
      responses:
        "201":
          $ref: "#/components/responses/layer"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "422":
          $ref: "#/components/responses/projectFull"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/layer:
    put:
      operationId: layerUpdate
      summary: Update a layer.
      description: |
        Replaces the name and description of a layer.
      tags: [layer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/layerUpdateRequest"
      responses:
        "200":
          $ref: "#/components/responses/layer"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/revisionConflict"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

    delete:
      operationId: layerDelete
      summary: Delete a notes layer.
      description: |
        Deletes a notes layer with its cells, and returns the layer as it was. The layers after it move up
        one place. The manuscript layer stays for the life of its project.
      tags: [layer]
      parameters:
        - $ref: "#/components/parameters/layerID"
        - $ref: "#/components/parameters/revision"
      responses:
        "200":
          $ref: "#/components/responses/layer"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/revisionConflict"
        "422":
          $ref: "#/components/responses/manuscriptLayer"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/layer/move:
    post:
      operationId: layerMove
      summary: Move a layer.
      description: |
        Moves a layer right after the layer `after` names, or first without it. Returns every layer of the
        project in their new order.
      tags: [layer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/layerMoveRequest"
      responses:
        "200":
          $ref: "#/components/responses/layerList"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

  /v1/cell:
    put:
      operationId: cellWrite
      summary: Write a cell.
      description: |
        Writes the content of the cell where a scene and a layer of the same project cross. The content
        follows the content schema of the layer's kind and weighs at most 256 KiB. A first write names
        revision 0.
      tags: [cell]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cellWriteRequest"
      responses:
        "200":
          $ref: "#/components/responses/cell"
        "400":
          $ref: "#/components/responses/badRequest"
        "401":
          $ref: "#/components/responses/invalidToken"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "409":
          $ref: "#/components/responses/revisionConflict"
        "429":
          $ref: "#/components/responses/tooManyRequests"
        "503":
          $ref: "#/components/responses/plannedDowntime"
        default:
          $ref: "#/components/responses/internalError"

components:
  responses:
    pong:
      description: Server is alive.
      content:
        text/plain:
          schema:
            type: string
            examples: [pong]

    health:
      description: All server dependencies are healthy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/healthReport"
          examples:
            healthy:
              value: { "client:postgres": { "status": "up" }, "api:jsonKeys": { "status": "up" } }

    healthUnavailable:
      description: |
        At least one dependency probe failed. During a planned downtime, the body is a problem
        tagged `downtime` instead.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/plannedDowntimeProblem"
        application/json:
          schema:
            $ref: "#/components/schemas/healthReport"
          examples:
            degraded:
              value: { "client:postgres": { "status": "up" }, "api:jsonKeys": { "status": "down" } }

    plannedDowntime:
      description: |
        The service is in a planned downtime and refuses work until operators end it. The platform
        reads the announced window from the downtime document infra publishes.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/plannedDowntimeProblem"

    project:
      description: A project.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/project"

    projectList:
      description: A page of projects, newest first.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/project"

    projectComposer:
      description: A project with its whole Scenes Composer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/projectComposer"

    scene:
      description: A scene.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/scene"

    sceneList:
      description: Every scene of a project, in narrative order.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/scene"

    layer:
      description: A layer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/layer"

    layerList:
      description: Every layer of a project, in order.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/layer"

    cell:
      description: A cell.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/cell"

    badRequest:
      description: |
        The request could not be parsed, or failed validation. A validation failure names each invalid
        field and the rule it broke. Content that breaks its schema, and a move after an unknown or the
        moved item, answer without a body.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/invalidRequest"

    invalidToken:
      description: |
        The bearer token is missing or invalid, for instance expired. Refresh the session or sign in again.

    forbidden:
      description: |
        The session lacks the permission this route requires, such as an anonymous session, which owns no
        project.

    notFound:
      description: |
        The caller owns no such project, scene, layer or cell. A scene and a layer of two different
        projects share no cell.

    revisionConflict:
      description: |
        The stored data moved past the revision the request names. Read it again before retrying.

    projectFull:
      description: |
        The project already holds as many scenes or layers as it may.

    manuscriptLayer:
      description: |
        The manuscript layer stays for the life of its project.

    tooManyRequests:
      description: |
        The caller sent too many requests to this route. Retry once `Retry-After` has elapsed.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer

    internalError:
      description: Something unexpected happened.

  schemas:
    invalidRequest:
      type: object
      description: |
        An RFC 9457 problem details body whose tags name the request fields that failed validation. Field
        paths and rule codes come from the API definition, never from the submitted values.
      required: [type, title, status, tags]
      additionalProperties: false
      properties:
        type:
          type: string
          description: The problem type; about:blank makes the title the HTTP status text.
          const: about:blank
        title:
          type: string
          description: The HTTP status text.
          examples: [Bad Request]
        status:
          type: integer
          description: The HTTP status code.
          const: 400
        tags:
          type: object
          description: Public details about the failure. Clients ignore tags they do not know.
          required: [invalidFields]
          additionalProperties: true
          properties:
            invalidFields:
              type: object
              description: |
                Maps the path of each invalid field, in lower camel case with `.` for nesting and `[i]` for a
                list item, to the validation rule it broke. Standard rules carry their usual name (required,
                max); service rules name a domain check (notblank).
              additionalProperties:
                type: string
              examples:
                - { "title": "notblank" }

    projectID:
      type: string
      description: The unique identifier of a project.
      format: uuid
      examples: ["01920000-0000-7000-8000-000000000001"]

    sceneID:
      type: string
      description: The unique identifier of a scene.
      format: uuid
      examples: ["01920000-0000-7000-8000-000000000011"]

    layerID:
      type: string
      description: The unique identifier of a layer.
      format: uuid
      examples: ["01920000-0000-7000-8000-000000000021"]

    revision:
      type: integer
      description: The revision of a stored record, raised by every write.
      minimum: 1
      examples: [1]

    language:
      type: string
      description: The language the project is written in, as a BCP 47 tag.
      enum: [en, fr]

    project:
      type: object
      description: One narrative, written in one language, that its owner composes scene by scene.
      required: [id, title, premise, language, revision, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/projectID"
        title:
          type: string
          description: The title of the project.
          examples: ["Les Heures claires"]
        premise:
          type: string
          description: What the narrative is about, in a few sentences. Empty until the author writes one.
          examples: ["Marie attend un homme qui ne viendra pas."]
        language:
          $ref: "#/components/schemas/language"
        revision:
          $ref: "#/components/schemas/revision"
        createdAt:
          type: string
          description: When the project was created.
          format: date-time
          examples: ["2021-01-01T00:00:00Z"]
        updatedAt:
          type: string
          description: When the project was last written.
          format: date-time
          examples: ["2021-01-02T00:00:00Z"]

    projectComposer:
      type: object
      description: A project with every scene and layer, each list in its order, and every cell written so far.
      required: [id, title, premise, language, revision, createdAt, updatedAt, scenes, layers, cells]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/projectID"
        title:
          $ref: "#/components/schemas/project/properties/title"
        premise:
          $ref: "#/components/schemas/project/properties/premise"
        language:
          $ref: "#/components/schemas/language"
        revision:
          $ref: "#/components/schemas/revision"
        createdAt:
          $ref: "#/components/schemas/project/properties/createdAt"
        updatedAt:
          $ref: "#/components/schemas/project/properties/updatedAt"
        scenes:
          type: array
          description: The scenes of the project, in narrative order.
          items:
            $ref: "#/components/schemas/scene"
        layers:
          type: array
          description: The layers of the project, in order. The manuscript layer is one of them.
          items:
            $ref: "#/components/schemas/layer"
        cells:
          type: array
          description: The cells written so far, in no particular order.
          items:
            $ref: "#/components/schemas/cell"

    scene:
      type: object
      description: A column of the Scenes Composer.
      required: [id, projectID, position, title, synopsis, revision, updatedAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/sceneID"
        projectID:
          $ref: "#/components/schemas/projectID"
        position:
          type: integer
          description: The place of the scene in narrative order, from 0, with no gap.
          minimum: 0
          examples: [0]
        title:
          type: string
          description: The title of the scene. May be empty.
          examples: ["Ouverture"]
        synopsis:
          type: string
          description: What happens in the scene, in a few sentences. May be empty.
          examples: ["Marie attend sur le quai."]
        revision:
          $ref: "#/components/schemas/revision"
        updatedAt:
          type: string
          description: When the scene was last written.
          format: date-time
          examples: ["2021-01-02T00:00:00Z"]

    layer:
      type: object
      description: A row of the Scenes Composer. Its kind names the content schema its cells follow.
      required: [id, projectID, position, kind, name, description, revision, updatedAt]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/layerID"
        projectID:
          $ref: "#/components/schemas/projectID"
        position:
          type: integer
          description: The place of the layer among the rows, from 0, with no gap.
          minimum: 0
          examples: [0]
        kind:
          type: string
          description: |
            The content schema the cells of the layer follow: `manuscript` for the one manuscript layer,
            `notes` for free text. Later releases add kinds, so a client skips a layer of a kind it does not
            know.
          examples: [manuscript, notes]
        name:
          type: string
          description: The name of the layer.
          examples: ["Characters"]
        description:
          type: string
          description: What the layer records. May be empty.
          examples: ["Who appears in the scene."]
        revision:
          $ref: "#/components/schemas/revision"
        updatedAt:
          type: string
          description: When the layer was last written.
          format: date-time
          examples: ["2021-01-02T00:00:00Z"]

    cell:
      type: object
      description: What one layer says about one scene.
      required: [sceneID, layerID, content, revision, updatedAt]
      additionalProperties: false
      properties:
        sceneID:
          $ref: "#/components/schemas/sceneID"
        layerID:
          $ref: "#/components/schemas/layerID"
        content:
          $ref: "#/components/schemas/cellContent"
        revision:
          $ref: "#/components/schemas/revision"
        updatedAt:
          type: string
          description: When the cell was last written.
          format: date-time
          examples: ["2021-01-02T00:00:00Z"]

    cellContent:
      description: |
        A JSON document that follows the content schema of its layer's kind. The server validates it with
        the same schema files this definition references.
      anyOf:
        - $ref: "./internal/models/schemas/content.manuscript.schema.json"
        - $ref: "./internal/models/schemas/content.notes.schema.json"

    projectCreateRequest:
      type: object
      description: The project to create.
      required: [title, language]
      additionalProperties: false
      examples:
        - { "title": "Les Heures claires", "language": "fr", "scenes": [{ "title": "Ouverture" }] }
      properties:
        title:
          type: string
          description: The title of the project. Not blank.
          maxLength: 200
          examples: ["Les Heures claires"]
        premise:
          type: string
          description: What the narrative is about.
          maxLength: 4000
          examples: ["Marie attend un homme qui ne viendra pas."]
        language:
          $ref: "#/components/schemas/language"
        scenes:
          type: array
          description: The scenes the project starts with, in order, such as those of a preset.
          maxItems: 100
          items:
            $ref: "#/components/schemas/projectCreateScene"

    projectCreateScene:
      type: object
      description: A scene a new project starts with.
      additionalProperties: false
      properties:
        title:
          type: string
          description: The title of the scene.
          maxLength: 200
          examples: ["Ouverture"]
        synopsis:
          type: string
          description: What happens in the scene.
          maxLength: 4000
          examples: ["Marie attend sur le quai."]

    projectUpdateRequest:
      type: object
      description: The new fields of a project.
      required: [id, revision, title, language]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/projectID"
        revision:
          $ref: "#/components/schemas/revision"
        title:
          $ref: "#/components/schemas/projectCreateRequest/properties/title"
        premise:
          $ref: "#/components/schemas/projectCreateRequest/properties/premise"
        language:
          $ref: "#/components/schemas/language"

    sceneCreateRequest:
      type: object
      description: The scene to add, and where.
      required: [projectID]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        after:
          $ref: "#/components/schemas/sceneID"
          description: The scene the new one follows. Omit it to place the new scene first.
        title:
          $ref: "#/components/schemas/projectCreateScene/properties/title"
        synopsis:
          $ref: "#/components/schemas/projectCreateScene/properties/synopsis"

    sceneUpdateRequest:
      type: object
      description: The new fields of a scene.
      required: [id, revision]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/sceneID"
        revision:
          $ref: "#/components/schemas/revision"
        title:
          $ref: "#/components/schemas/projectCreateScene/properties/title"
        synopsis:
          $ref: "#/components/schemas/projectCreateScene/properties/synopsis"

    sceneMoveRequest:
      type: object
      description: The scene to move, and where.
      required: [id]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/sceneID"
        after:
          $ref: "#/components/schemas/sceneID"
          description: The scene the moved one follows. Omit it to move the scene first.

    layerCreateRequest:
      type: object
      description: The notes layer to add, and where.
      required: [projectID, name]
      additionalProperties: false
      properties:
        projectID:
          $ref: "#/components/schemas/projectID"
        after:
          $ref: "#/components/schemas/layerID"
          description: The layer the new one follows. Omit it to place the new layer first.
        name:
          type: string
          description: The name of the layer. Not blank.
          maxLength: 100
          examples: ["Characters"]
        description:
          type: string
          description: What the layer records.
          maxLength: 1000
          examples: ["Who appears in the scene."]

    layerUpdateRequest:
      type: object
      description: The new fields of a layer.
      required: [id, revision, name]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/layerID"
        revision:
          $ref: "#/components/schemas/revision"
        name:
          $ref: "#/components/schemas/layerCreateRequest/properties/name"
        description:
          $ref: "#/components/schemas/layerCreateRequest/properties/description"

    layerMoveRequest:
      type: object
      description: The layer to move, and where.
      required: [id]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/layerID"
        after:
          $ref: "#/components/schemas/layerID"
          description: The layer the moved one follows. Omit it to move the layer first.

    cellWriteRequest:
      type: object
      description: The content of a cell, and the revision the caller read.
      required: [sceneID, layerID, revision, content]
      additionalProperties: false
      properties:
        sceneID:
          $ref: "#/components/schemas/sceneID"
        layerID:
          $ref: "#/components/schemas/layerID"
        revision:
          type: integer
          description: The revision the caller read, 0 for a cell nobody wrote yet.
          minimum: 0
          examples: [0]
        content:
          $ref: "#/components/schemas/cellContent"

    plannedDowntimeProblem:
      type: object
      description: |
        An RFC 9457 problem details body answering a request refused during a planned downtime. Clients
        ignore extension members they do not know.
      required: [type, title, status, tags]
      additionalProperties: true
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
        status:
          type: integer
          const: 503
        tags:
          type: object
          required: [downtime]
          properties:
            downtime:
              type: boolean
              const: true
    healthReport:
      type: object
      description: The status of each dependency. Every dependency must be up for HTTP 200.
      required: ["client:postgres", "api:jsonKeys"]
      additionalProperties:
        $ref: "#/components/schemas/healthStatus"
      properties:
        "client:postgres":
          $ref: "#/components/schemas/healthStatus"
        "api:jsonKeys":
          $ref: "#/components/schemas/healthStatus"
    healthStatus:
      type: object
      description: |
        The status of one dependency, as the server observed it. The endpoint is unauthenticated,
        so the entry carries the state alone. Diagnostics stay on server-side traces.
      required: [status]
      additionalProperties: false
      examples:
        - { "status": "up" }
        - { "status": "down" }
      properties:
        status:
          type: string
          description: Whether the server reached the dependency.
          enum: [up, down]

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: An access token from the authentication service, for a signed-in user.

  parameters:
    projectID:
      name: id
      in: query
      description: The project to act on.
      required: true
      schema:
        $ref: "#/components/schemas/projectID"

    sceneID:
      name: id
      in: query
      description: The scene to act on.
      required: true
      schema:
        $ref: "#/components/schemas/sceneID"

    layerID:
      name: id
      in: query
      description: The layer to act on.
      required: true
      schema:
        $ref: "#/components/schemas/layerID"

    revision:
      name: revision
      in: query
      description: The revision the caller read.
      required: true
      schema:
        $ref: "#/components/schemas/revision"

    limit:
      name: limit
      in: query
      description: Maximum number of projects to return, at most 100. Omitted or 0, the page holds 20.
      required: false
      schema:
        type: integer
        maximum: 100
        default: 20
        examples: [10]

    after:
      name: after
      in: query
      description: |
        ID of the last project of the previous page. The page starts with the next older project, even
        when that project was deleted since. Omitted, the page starts at the newest project.
      required: false
      schema:
        $ref: "#/components/schemas/projectID"
