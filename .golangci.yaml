version: "2"

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gci:
      sections:
        - standard # Standard section: captures all standard packages.
        - default # Default section: contains all imports that could not be matched to another section type.
        - prefix(github.com/a-novel-kit)
        - prefix(github.com/a-novel)
        - localmodule

linters:
  default: none
  enable: # https://golangci-lint.run/docs/configuration/file/
    #    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    #    - cyclop
    - decorder
    #    - depguard
    - dogsled
    #    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    #    - exhaustive
    #    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    #    - funlen
    #    - ginkgolinter
    - gocheckcompilerdirectives
    #    - gochecknoglobals
    #    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    #    - godox
    - goheader
    - gomoddirectives
    #    - gomodguard
    - goprintffuncname
    - gosec
    #    - gosmopolitan
    - govet
    - grouper
    #    - iface
    - importas
    - inamedparam
    - ineffassign
    #    - interfacebloat
    - intrange
    - iotamixing
    #    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - musttag
    - nakedret
    #    - nestif
    - nilerr
    - nilnesserr
    #    - nilnil
    - nlreturn
    - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    #    - promlinter
    - protogetter
    - reassign
    - recvcheck
    #    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    #    - varnamelen
    - wastedassign
    - whitespace
    #    - wrapcheck
    #    - wsl
    - wsl_v5
    - zerologlint

  settings:
    forbidigo:
      forbid:
        # Declaring forbid replaces the linter's built-in pattern outright rather than adding to it,
        # so the print rule has to be restated here. Dropping it would be a silent regression inside
        # the very change that adds the rules below.
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
          msg: Remove the print statement. The service reports through logging.Log.
        - pattern: ^http\.DefaultClient$
          msg: Use the client cmd builds from lib.NewHTTPClient. The process-global one is unsized and untraced.
        - pattern: ^http\.DefaultTransport$
          msg: Use lib.NewTransport. The process-global transport keeps two idle connections per host.
        - pattern: ^http\.(Get|Head|Post|PostForm)$
          msg: These run on http.DefaultClient and take no context. Use the injected client.
    tagliatelle:
      case:
        rules:
          json: goCamel
          yaml: goCamel

  exclusions:
    paths:
      - mocks
    rules:
      - path: (.+)_test.go
        linters:
          - forcetypeassert
          - maintidx
          - gocognit
          - gocyclo
          - tagliatelle
          - goconst
          - gocritic
          - err113
          - prealloc
