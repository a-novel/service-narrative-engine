services:
  postgres-json-keys:
    image: ghcr.io/a-novel/service-json-keys/database:v2.5.0
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-json-keys:
    image: ghcr.io/a-novel/service-json-keys/standalone-grpc:v2.5.0
    depends_on:
      postgres-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-json-keys:5432/postgres?sslmode=disable
      APP_MASTER_KEY: "${APP_MASTER_KEY}"
    networks:
      - narrative-engine-integration-rest-test

  postgres-authentication:
    image: ghcr.io/a-novel/service-authentication/database:v2.5.0
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-authentication:
    image: ghcr.io/a-novel/service-authentication/standalone-rest:v2.5.0
    ports:
      - "${SERVICE_AUTHENTICATION_PORT}:8080"
    depends_on:
      postgres-authentication:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-authentication:5432/postgres?sslmode=disable
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-noreply@agorastoryverse.com}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:-admin}"
    networks:
      - narrative-engine-integration-rest-test

  postgres-authentication-b:
    image: ghcr.io/a-novel/service-authentication/database:v2.5.0
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-authentication-b:
    image: ghcr.io/a-novel/service-authentication/standalone-rest:v2.5.0
    ports:
      - "${SERVICE_AUTHENTICATION_B_PORT}:8080"
    depends_on:
      postgres-authentication-b:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-authentication-b:5432/postgres?sslmode=disable
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_B_EMAIL:-other@agorastoryverse.com}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_B_PASSWORD:-admin}"
    networks:
      - narrative-engine-integration-rest-test

  openai-mock:
    image: node:24-alpine
    command: ["node", "/app/openaiMock.mjs"]
    ports:
      - "${OPENAI_MOCK_PORT}:8080"
    volumes:
      - ../pkg/js/test/rest/testdata/openaiMock.mjs:/app/openaiMock.mjs:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 1s
      timeout: 1s
      retries: 30
    networks:
      - narrative-engine-integration-rest-test

  postgres-genai:
    image: ghcr.io/a-novel/service-genai/database:v0.3.0
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-genai-migrations:
    image: ghcr.io/a-novel/service-genai/jobs/migrations:v0.3.0
    depends_on:
      postgres-genai:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-genai:5432/postgres?sslmode=disable
    networks:
      - narrative-engine-integration-rest-test

  service-genai:
    image: ghcr.io/a-novel/service-genai/grpc:v0.3.0
    depends_on:
      postgres-genai:
        condition: service_healthy
      service-genai-migrations:
        condition: service_completed_successfully
      openai-mock:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-genai:5432/postgres?sslmode=disable
      OPENAI_API_KEY: test
      OPENAI_BASE_URL: http://openai-mock:8080/v1
      WORKER_INTERVAL: 100ms
      WORKER_POLL_INTERVAL: 100ms
    networks:
      - narrative-engine-integration-rest-test

  postgres-narrative-engine:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-narrative-engine:
    build:
      context: ..
      dockerfile: ./builds/standalone.rest.Dockerfile
    ports:
      - "${REST_PORT}:8080"
    depends_on:
      postgres-narrative-engine:
        condition: service_healthy
      service-genai:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://postgres:postgres@postgres-narrative-engine:5432/${POSTGRES_DB}?sslmode=disable"
      SERVICE_GENAI_HOST: service-genai
      SERVICE_GENAI_PORT: 8080
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
    networks:
      - narrative-engine-integration-rest-test

networks:
  narrative-engine-integration-rest-test:
