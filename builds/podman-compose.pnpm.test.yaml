services:
  mailserver:
    image: ghcr.io/axllent/mailpit:v1.32.0
    ports:
      - "${MAIL_UI_PORT}:8025"
    networks:
      - narrative-engine-integration-rest-test
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DISABLE_WAL: "true"

  postgres-json-keys:
    image: ghcr.io/a-novel/service-json-keys/database:v2.13.4@sha256:8778711f5c9beb691b741b2edbbcccf4e5f857b0ff3380fbf2210dea194aab5a
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-json-keys:
    image: ghcr.io/a-novel/service-json-keys/standalone-grpc:v2.13.4@sha256:650ee2b4a0ddd842c30a8d7d5266c29d590a1e15e82e7bb010b2f3fe94984ed8
    depends_on:
      postgres-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      APP_MASTER_KEY: "${APP_MASTER_KEY}"
    networks:
      - narrative-engine-integration-rest-test

  postgres-authentication:
    image: ghcr.io/a-novel/service-authentication/database:v2.17.1@sha256:6e8aab13a3f8a3cff10c39f87d8d50a3153dabe88d7da3b20786079239f68ae1
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-authentication:
    image: ghcr.io/a-novel/service-authentication/standalone-rest:v2.17.1@sha256:ca70c8697412c58c48e9e57f3ffcaaa071c96db5d367aa97fcfa3638d8b10c55
    ports:
      - "${SERVICE_AUTHENTICATION_PORT}:8080"
    depends_on:
      postgres-authentication:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
      mailserver:
        condition: service_started
    command:
      - sh
      - -c
      - >-
        /migrations &&
        /maintenance account-role --email "$${SUPER_ADMIN_EMAIL}" --role auth:superadmin --lang en &&
        exec /rest
    environment:
      POSTGRES_HOST: postgres-authentication
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-noreply@agorastoryverse.com}"
      PLATFORM_AUTH_URL: http://localhost
      SMTP_SENDER_DOMAIN: mailserver
      SMTP_ADDR: mailserver:1025
      SMTP_SENDER_NAME: Narrative Engine integration tests
      SMTP_SENDER_EMAIL: noreply@agorastoryverse.com
      SMTP_SENDER_PASSWORD: test-only
      SMTP_FORCE_UNENCRYPTED: "true"
    networks:
      - narrative-engine-integration-rest-test
  postgres-genai:
    image: ghcr.io/a-novel/service-genai/database:v0.4.0
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-genai-migrations:
    image: ghcr.io/a-novel/service-genai/jobs/migrations:v0.4.0
    depends_on:
      postgres-genai:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-genai:5432/postgres?sslmode=disable
    networks:
      - narrative-engine-integration-rest-test

  service-genai:
    image: ghcr.io/a-novel/service-genai/grpc:v0.4.0
    depends_on:
      postgres-genai:
        condition: service_healthy
      service-genai-migrations:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-genai:5432/postgres?sslmode=disable
      OPENAI_API_KEY: "${OPENAI_API_KEY:-test}"
    networks:
      - narrative-engine-integration-rest-test

  postgres-narrative-engine:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-narrative-engine:
    build:
      context: ..
      dockerfile: ./builds/standalone.rest.Dockerfile
    ports:
      - "${REST_PORT}:8080"
    depends_on:
      postgres-narrative-engine:
        condition: service_healthy
      service-genai:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://postgres:postgres@postgres-narrative-engine:5432/${POSTGRES_DB}?sslmode=disable"
      SERVICE_GENAI_HOST: service-genai
      SERVICE_GENAI_PORT: 8080
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
    networks:
      - narrative-engine-integration-rest-test

networks:
  narrative-engine-integration-rest-test:
