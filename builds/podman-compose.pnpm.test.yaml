services:
  mailserver:
    image: ghcr.io/axllent/mailpit:v1.32.0
    ports:
      - "${MAIL_UI_PORT}:8025"
    networks:
      - narrative-engine-integration-rest-test
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DISABLE_WAL: "true"

  postgres-json-keys:
    image: ghcr.io/a-novel/service-json-keys/database:v2.13.8@sha256:a7fd1aa7ba4476c6775e391fd632e0e292ca0667a25bec07a0cc3fab57afad3a
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-json-keys:
    image: ghcr.io/a-novel/service-json-keys/standalone-grpc:v2.13.8@sha256:cc98bac2189237b4b412bf9ce1d5c5b0d7d86f78dfa4819dce429b4e4c85dd13
    depends_on:
      postgres-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres-json-keys
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      APP_MASTER_KEY: "${APP_MASTER_KEY}"
    networks:
      - narrative-engine-integration-rest-test

  postgres-authentication:
    image: ghcr.io/a-novel/service-authentication/database:v2.18.3@sha256:cce2b62f9486ddbf490e142525c444777782593845b1c2a6ab4ddab06eb94846
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-authentication:
    image: ghcr.io/a-novel/service-authentication/standalone-rest:v2.18.3@sha256:0ced347da22073e9b06f33cf319f3b8713b2638677654858c1d5b2c70d102ff1
    ports:
      - "${SERVICE_AUTHENTICATION_PORT}:8080"
    depends_on:
      postgres-authentication:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
      mailserver:
        condition: service_started
    command:
      - sh
      - -c
      - >-
        /migrations &&
        /maintenance account-role --email "$${SUPER_ADMIN_EMAIL}" --role auth:superadmin --lang en &&
        exec /rest
    environment:
      POSTGRES_HOST: postgres-authentication
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: postgres
      POSTGRES_TLS_ENABLED: "false"
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-noreply@agorastoryverse.com}"
      PLATFORM_AUTH_URL: http://localhost
      SMTP_SENDER_DOMAIN: mailserver
      SMTP_ADDR: mailserver:1025
      SMTP_SENDER_NAME: Narrative Engine integration tests
      SMTP_SENDER_EMAIL: noreply@agorastoryverse.com
      SMTP_SENDER_PASSWORD: test-only
      SMTP_FORCE_UNENCRYPTED: "true"
    networks:
      - narrative-engine-integration-rest-test
  postgres-genai:
    image: ghcr.io/a-novel/service-genai/database:v0.7.4@sha256:880e760f2f03f4ffdaf2affc186d10a91a12f711602a4c0983a9d70d837efb70
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-genai-migrations:
    image: ghcr.io/a-novel/service-genai/jobs/migrations:v0.7.4@sha256:b51b10e271d29e67aeed16ec37ae06a93920ce4b50b3491ce87ee4c16a3187da
    depends_on:
      postgres-genai:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-genai:5432/postgres?sslmode=disable
    networks:
      - narrative-engine-integration-rest-test

  service-genai:
    image: ghcr.io/a-novel/service-genai/grpc:v0.7.4@sha256:1addd9ad74ce419e4624563b60d0217a20dc9f57c291f58e872be52b7132d65b
    depends_on:
      postgres-genai:
        condition: service_healthy
      service-genai-migrations:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-genai:5432/postgres?sslmode=disable
      OPENAI_API_KEY: "${OPENAI_API_KEY:-test}"
    networks:
      - narrative-engine-integration-rest-test

  postgres-narrative-engine:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-narrative-engine:
    build:
      context: ..
      dockerfile: ./builds/standalone.rest.Dockerfile
    ports:
      - "${REST_PORT}:8080"
    depends_on:
      postgres-narrative-engine:
        condition: service_healthy
      service-genai:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://postgres:postgres@postgres-narrative-engine:5432/${POSTGRES_DB}?sslmode=disable"
      SERVICE_GENAI_HOST: service-genai
      SERVICE_GENAI_PORT: 8080
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
    networks:
      - narrative-engine-integration-rest-test

networks:
  narrative-engine-integration-rest-test:
