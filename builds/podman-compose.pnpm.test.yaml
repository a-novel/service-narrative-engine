services:
  mailserver:
    image: ghcr.io/axllent/mailpit:v1.31.6
    ports:
      - "${MAIL_UI_PORT}:8025"
    networks:
      - narrative-engine-integration-rest-test
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DISABLE_WAL: "true"

  postgres-json-keys:
    image: ghcr.io/a-novel/service-json-keys/database:v2.12.2@sha256:a421bf1d7f00194505779efaa1f9cf643d57f11b346ba3d0f349bcf829fe11eb
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-json-keys:
    image: ghcr.io/a-novel/service-json-keys/standalone-grpc:v2.12.2@sha256:d07f0ec4369be99a6e37b2755024cfff67fce0f16457ce1c6dac4d09898e5812
    depends_on:
      postgres-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-json-keys:5432/postgres?sslmode=disable
      APP_MASTER_KEY: "${APP_MASTER_KEY}"
    networks:
      - narrative-engine-integration-rest-test

  postgres-authentication:
    image: ghcr.io/a-novel/service-authentication/database:v2.15.1@sha256:c4d8cb051e88c721912037537e6546694736f8f0183cc59994c230369fbc593c
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-authentication:
    image: ghcr.io/a-novel/service-authentication/standalone-rest:v2.15.1@sha256:7e0fdd17af1af2b812db7ff3075782027e41765f9bb6ffe3bdc38f638702dd77
    ports:
      - "${SERVICE_AUTHENTICATION_PORT}:8080"
    depends_on:
      postgres-authentication:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
      mailserver:
        condition: service_started
    command:
      - sh
      - -c
      - >-
        /migrations &&
        /maintenance account-role --email "$${SUPER_ADMIN_EMAIL}" --role auth:superadmin --lang en &&
        exec /rest
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-authentication:5432/postgres?sslmode=disable
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:-noreply@agorastoryverse.com}"
      PLATFORM_AUTH_URL: http://localhost
      SMTP_SENDER_DOMAIN: mailserver
      SMTP_ADDR: mailserver:1025
      SMTP_SENDER_NAME: Narrative Engine integration tests
      SMTP_SENDER_EMAIL: noreply@agorastoryverse.com
      SMTP_SENDER_PASSWORD: test-only
      SMTP_FORCE_UNENCRYPTED: "true"
    networks:
      - narrative-engine-integration-rest-test
  postgres-genai:
    image: ghcr.io/a-novel/service-genai/database:v0.4.0
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-genai-migrations:
    image: ghcr.io/a-novel/service-genai/jobs/migrations:v0.4.0
    depends_on:
      postgres-genai:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-genai:5432/postgres?sslmode=disable
    networks:
      - narrative-engine-integration-rest-test

  service-genai:
    image: ghcr.io/a-novel/service-genai/grpc:v0.4.0
    depends_on:
      postgres-genai:
        condition: service_healthy
      service-genai-migrations:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-genai:5432/postgres?sslmode=disable
      OPENAI_API_KEY: "${OPENAI_API_KEY:-test}"
    networks:
      - narrative-engine-integration-rest-test

  postgres-narrative-engine:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-narrative-engine:
    build:
      context: ..
      dockerfile: ./builds/standalone.rest.Dockerfile
    ports:
      - "${REST_PORT}:8080"
    depends_on:
      postgres-narrative-engine:
        condition: service_healthy
      service-genai:
        condition: service_healthy
      service-json-keys:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://postgres:postgres@postgres-narrative-engine:5432/${POSTGRES_DB}?sslmode=disable"
      SERVICE_GENAI_HOST: service-genai
      SERVICE_GENAI_PORT: 8080
      SERVICE_JSON_KEYS_HOST: service-json-keys
      SERVICE_JSON_KEYS_PORT: 8080
    networks:
      - narrative-engine-integration-rest-test

networks:
  narrative-engine-integration-rest-test:
