services:
  postgres-jobs:
    image: ghcr.io/a-novel/service-jobs/database:v0.2.0
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-jobs-migrations:
    image: ghcr.io/a-novel/service-jobs/jobs/migrations:v0.2.0
    depends_on:
      postgres-jobs:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-jobs:5432/postgres?sslmode=disable
    networks:
      - narrative-engine-integration-rest-test

  service-jobs:
    image: ghcr.io/a-novel/service-jobs/standalone-grpc:v0.2.0
    depends_on:
      postgres-jobs:
        condition: service_healthy
      service-jobs-migrations:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-jobs:5432/postgres?sslmode=disable
    networks:
      - narrative-engine-integration-rest-test

  postgres-narrative-engine:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    networks:
      - narrative-engine-integration-rest-test
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-narrative-engine:
    build:
      context: ..
      dockerfile: ./builds/standalone.rest.Dockerfile
    ports:
      - "${REST_PORT}:8080"
    depends_on:
      postgres-narrative-engine:
        condition: service_healthy
      service-jobs:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://postgres:postgres@postgres-narrative-engine:5432/${POSTGRES_DB}?sslmode=disable"
      SERVICE_JOBS_HOST: service-jobs
      SERVICE_JOBS_PORT: 8080
    networks:
      - narrative-engine-integration-rest-test

networks:
  narrative-engine-integration-rest-test:
