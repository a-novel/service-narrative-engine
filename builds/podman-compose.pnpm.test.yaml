# Podman drops a Dockerfile's HEALTHCHECK from OCI images, the format it builds by default and the
# one images are published in: a service the others wait for declares its check here.
x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD", "pg_isready"]
  interval: 1s
  timeout: 5s
  retries: 10

services:
  postgres-template:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    networks:
      - template-integration-rest-test
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    healthcheck: *postgres-healthcheck

  service-template:
    build:
      context: ..
      dockerfile: ./builds/standalone.rest.Dockerfile
    ports:
      - "${REST_PORT}:8080"
    depends_on:
      postgres-template:
        condition: service_healthy
    environment:
      POSTGRES_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-template:5432/${POSTGRES_DB}?sslmode=disable"
      # The suite sends many requests per route within a second from one address.
      REST_RATE_LIMITS_ENABLED: false
    networks:
      - template-integration-rest-test

networks:
  template-integration-rest-test:
