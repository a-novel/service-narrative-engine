# The lock beside this file pins every package this config resolves to. Refresh it with
# apko lock builds/database.apko.yaml --arch x86_64 --output builds/database.apko.lock.json
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - busybox
    - ca-certificates-bundle
    - postgresql-18
    - postgresql-18-client
    - postgresql-18-contrib
    - postgresql-18-oci-entrypoint-base
    - gosu
    - glibc-locale-en
    - libxml2-16
    - libbz2-1
    - lz4
    - zstd
    - libssh2
    - openssl
accounts:
  groups:
    - groupname: postgres
      gid: 999
  users:
    - username: postgres
      uid: 999
      gid: 999
      homedir: /var/lib/postgresql
paths:
  - path: /var/lib/postgresql
    type: directory
    uid: 999
    gid: 999
    permissions: 0700
  - path: /var/run/postgresql
    type: directory
    uid: 999
    gid: 999
    permissions: 03775
