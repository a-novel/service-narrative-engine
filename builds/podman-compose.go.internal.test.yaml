services:
  postgres-jobs:
    image: ghcr.io/a-novel/service-jobs/database:v0.2.0
    networks:
      - narrative-engine-api-test
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

  service-jobs-migrations:
    image: ghcr.io/a-novel/service-jobs/jobs/migrations:v0.2.0
    depends_on:
      postgres-jobs:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-jobs:5432/postgres?sslmode=disable
    networks:
      - narrative-engine-api-test

  service-jobs:
    image: ghcr.io/a-novel/service-jobs/standalone-grpc:v0.2.0
    ports:
      - "${SERVICE_JOBS_PORT}:8080"
    depends_on:
      postgres-jobs:
        condition: service_healthy
      service-jobs-migrations:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: postgres://postgres:postgres@postgres-jobs:5432/postgres?sslmode=disable
    networks:
      - narrative-engine-api-test

  postgres-narrative-engine:
    build:
      context: ..
      dockerfile: ./builds/database.Dockerfile
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - narrative-engine-api-test
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256

networks:
  narrative-engine-api-test:
